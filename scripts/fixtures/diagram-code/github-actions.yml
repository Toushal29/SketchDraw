name: Build and release
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run lint
        run: npm run lint
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - run: npm test
  release:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - run: npm run release
