    <rect x="613" y="198" width="416" height="68" rx="12" fill="#252c31" stroke="#424a50" filter="url(#shadow)"/>
    <rect x="629" y="211" width="42" height="42" rx="10" fill="#364139" stroke="#4b5a4e"/><path d="m641 232 8-12 8 12h-5l-3 9-2-9z" fill="none" stroke="#a3c0a7" stroke-width="1.8"/>
    <path d="M691 221h19m-9-9v18m25-9 14 14m0-14-14 14m31-14h21m-10-10v20m30 0v-20m-8 9 8-9 8 9" fill="none" stroke="#c1cbc3" stroke-width="2"/>
    <circle cx="866" cy="232" r="12" fill="none" stroke="#c1cbc3" stroke-width="2"/><rect x="900" y="220" width="25" height="24" rx="4" fill="none" stroke="#c1cbc3" stroke-width="2"/>
