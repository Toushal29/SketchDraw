<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">SketchDraw toolbar surface follows the light and dark application themes</title>
  <desc id="desc">The View menu has an Auto toolbar surface option that changes between a light surface and a dark slate surface with the app theme.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="145%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#20302b" flood-opacity=".12"/></filter></defs>
  <rect width="1120" height="560" rx="24" fill="#f1f4f2"/>
  <text x="40" y="48" fill="#64746a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="2">TOOLBAR SURFACE</text>
  <text x="40" y="82" fill="#26362d" font-family="Segoe UI, sans-serif" font-size="25" font-weight="650">Match the toolbar to your app theme</text>
  <rect x="28" y="108" width="1064" height="416" rx="18" fill="#fff" stroke="#e1e7e3"/>
  <text x="74" y="157" fill="#617066" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="1">LIGHT APPEARANCE</text>
  <text x="598" y="157" fill="#617066" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="1">DARK APPEARANCE</text>
  <rect x="70" y="176" width="452" height="112" rx="15" fill="#fafbf9" stroke="#e0e5e1"/>
  <rect x="594" y="176" width="452" height="112" rx="15" fill="#1d2228" stroke="#333a42"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <rect x="89" y="198" width="416" height="68" rx="12" fill="#f8faf7" stroke="#dce3dd" filter="url(#shadow)"/>
