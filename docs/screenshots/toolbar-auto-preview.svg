  <text x="381" y="447" fill="#718078" font-family="Segoe UI, sans-serif" font-size="10">Paper · Warm · Slate · Sage · Night · Custom</text>
  <text x="40" y="510" fill="#7a867e" font-family="Segoe UI, sans-serif" font-size="10">Auto updates the toolbar surface as the application appearance changes. Choose a named or custom color to keep it fixed.</text>
</svg>
