<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">View settings for interface and canvas appearance</title>
  <desc id="desc">A compact settings panel shows interface accent and toolbar surface controls, plus separate whiteboard color and paper pattern controls. No application theme selector is present.</desc>
  <rect width="1120" height="600" rx="22" fill="#f1f3f6"/>
  <text x="40" y="48" fill="#647080" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">SKETCHDRAW · VIEW SETTINGS</text>
  <text x="40" y="84" fill="#202531" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Tune the workspace around your design</text>
  <rect x="40" y="112" width="1040" height="438" rx="14" fill="#fff" stroke="#dce1e8"/>
  <rect x="62" y="136" width="996" height="52" rx="8" fill="#f7f8fa"/>
  <text x="86" y="168" fill="#303747" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="650">Interface</text>
  <text x="198" y="168" fill="#8a92a0" font-family="Segoe UI,Arial,sans-serif" font-size="13">Canvas</text>
  <path d="M62 201h996" stroke="#e6e9ee"/>
  <text x="84" y="238" fill="#747c8b" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing=".8">ACCENT COLOR</text>
  <circle cx="98" cy="274" r="14" fill="#697586"/><circle cx="142" cy="274" r="14" fill="#315ee7"/><circle cx="186" cy="274" r="14" fill="#10a37f"/><circle cx="230" cy="274" r="14" fill="#ef6b4a"/><circle cx="274" cy="274" r="14" fill="#8b5cf6"/>
  <rect x="316" y="255" width="94" height="38" rx="7" fill="#fff" stroke="#dce1e8"/><circle cx="336" cy="274" r="10" fill="#f4f5f7" stroke="#b9c0cb"/><text x="354" y="278" fill="#596272" font-family="Segoe UI,Arial,sans-serif" font-size="10">Custom</text>
  <path d="M84 322h952" stroke="#eceef2"/>
  <text x="84" y="357" fill="#747c8b" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing=".8">TOOLBAR SURFACE</text>
  <rect x="84" y="373" width="150" height="40" rx="7" fill="#f4f6f8" stroke="#aeb8c7"/><text x="159" y="398" text-anchor="middle" fill="#303747" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600">Default</text>
  <rect x="244" y="373" width="150" height="40" rx="7" fill="#fff" stroke="#dce1e8"/><text x="319" y="398" text-anchor="middle" fill="#596272" font-family="Segoe UI,Arial,sans-serif" font-size="11">Paper</text>
  <rect x="404" y="373" width="150" height="40" rx="7" fill="#e9edf2" stroke="#dce1e8"/><text x="479" y="398" text-anchor="middle" fill="#596272" font-family="Segoe UI,Arial,sans-serif" font-size="11">Slate</text>
  <rect x="564" y="373" width="148" height="40" rx="7" fill="#fff" stroke="#dce1e8"/><circle cx="585" cy="393" r="10" fill="#f4f5f7" stroke="#b9c0cb"/><text x="603" y="397" fill="#596272" font-family="Segoe UI,Arial,sans-serif" font-size="10">Custom</text>
  <text x="84" y="455" fill="#747c8b" font-family="Segoe UI,Arial,sans-serif" font-size="11">Toolbar colors are independent from the fixed application interface palette.</text>
  <rect x="748" y="222" width="286" height="286" rx="10" fill="#fbfcfd" stroke="#e3e7ed"/>
  <text x="772" y="258" fill="#303747" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="650">Canvas appearance</text>
  <text x="772" y="292" fill="#747c8b" font-family="Segoe UI,Arial,sans-serif" font-size="11">Whiteboard color</text>
  <rect x="772" y="305" width="238" height="38" rx="6" fill="#fff" stroke="#dce1e8"/><rect x="782" y="314" width="20" height="20" rx="4" fill="#fff" stroke="#dce1e8"/><text x="814" y="329" fill="#303747" font-family="Segoe UI,Arial,sans-serif" font-size="11">Default / custom</text>
  <text x="772" y="377" fill="#747c8b" font-family="Segoe UI,Arial,sans-serif" font-size="11">Paper pattern</text>
  <rect x="772" y="390" width="54" height="46" rx="6" fill="#fff" stroke="#dce1e8"/><text x="799" y="465" text-anchor="middle" fill="#596272" font-family="Segoe UI,Arial,sans-serif" font-size="10">Plain</text>
  <rect x="842" y="390" width="54" height="46" rx="6" fill="#fff" stroke="#dce1e8"/><path d="M850 402h38m-38 12h38m-38 12h38M859 394v38m12-38v38m12-38v38" stroke="#d9dee6"/><text x="869" y="465" text-anchor="middle" fill="#596272" font-family="Segoe UI,Arial,sans-serif" font-size="10">Grid</text>
  <rect x="912" y="390" width="54" height="46" rx="6" fill="#fff" stroke="#dce1e8"/><circle cx="924" cy="402" r="1.5" fill="#c5ccd7"/><circle cx="939" cy="402" r="1.5" fill="#c5ccd7"/><circle cx="954" cy="402" r="1.5" fill="#c5ccd7"/><circle cx="924" cy="417" r="1.5" fill="#c5ccd7"/><circle cx="939" cy="417" r="1.5" fill="#c5ccd7"/><circle cx="954" cy="417" r="1.5" fill="#c5ccd7"/><text x="939" y="465" text-anchor="middle" fill="#596272" font-family="Segoe UI,Arial,sans-serif" font-size="10">Dots</text>
</svg>
