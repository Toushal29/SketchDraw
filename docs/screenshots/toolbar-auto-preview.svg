<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">Toolbar surface follows the application theme</title>
  <desc id="desc">View settings show Auto selected for toolbar surface alongside the named Paper, Warm, Slate, Sage, Night, and Custom choices. Example toolbars show the light and dark surfaces Auto follows.</desc>
  <defs><filter id="surface-shadow" x="-20%" y="-20%" width="145%" height="155%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#20302b" flood-opacity=".12"/></filter></defs>
  <rect width="1120" height="600" rx="24" fill="#f1f4f2"/><text x="36" y="46" fill="#64746a" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.7">INTERFACE APPEARANCE</text><text x="36" y="78" fill="#26362d" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Choose a toolbar surface</text>
  <g filter="url(#surface-shadow)">
    <rect x="36" y="102" width="375" height="65" rx="14" fill="#fff" stroke="#e1e7e3"/><text x="54" y="123" fill="#78857d" font-family="Segoe UI,Arial,sans-serif" font-size="8" font-weight="700" letter-spacing="1">LIGHT THEME</text><rect x="51" y="132" width="344" height="24" rx="8" fill="#f8faf7" stroke="#e0e5e1"/><g fill="none" stroke="#647267" stroke-width="1.6" stroke-linecap="round"><path d="M65 140h14m-7-7v14m21-7h17m-8-7v14"/><path d="M131 147l11-12 4 4-11 12-4 1z"/><circle cx="171" cy="143" r="7"/><path d="M193 137h14v12h-14zM225 136h14m-7-7v14m24 6v-14m-6 6 6-6 6 6"/></g><path d="M120 134v20m44-20v20m44-20v20m44-20v20" stroke="#e3e8e3"/>
    <rect x="423" y="102" width="375" height="65" rx="14" fill="#1d2228" stroke="#333a42"/><text x="441" y="123" fill="#a8b4aa" font-family="Segoe UI,Arial,sans-serif" font-size="8" font-weight="700" letter-spacing="1">DARK THEME</text><rect x="438" y="132" width="344" height="24" rx="8" fill="#252c31" stroke="#424a50"/><g fill="none" stroke="#c1cbc3" stroke-width="1.6" stroke-linecap="round"><path d="M452 140h14m-7-7v14m21-7h17m-8-7v14"/><path d="M518 147l11-12 4 4-11 12-4 1z"/><circle cx="558" cy="143" r="7"/><path d="M580 137h14v12h-14zM612 136h14m-7-7v14m24 6v-14m-6 6 6-6 6 6"/></g><path d="M507 134v20m44-20v20m44-20v20m44-20v20" stroke="#3b4447"/>
    <rect x="810" y="102" width="274" height="65" rx="14" fill="#fff" stroke="#e1e7e3"/><text x="829" y="124" fill="#64746a" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700">AUTO</text><text x="829" y="145" fill="#7c877e" font-family="Segoe UI,Arial,sans-serif" font-size="9">Matches Light and Dark above</text><circle cx="1053" cy="136" r="13" fill="#f7f9f7" stroke="#9aa69c"/><path d="M1053 123a13 13 0 0 0 0 26z" fill="#515e54"/>
  </g>
  <rect x="233" y="190" width="654" height="376" rx="16" fill="#fff" stroke="#dce3dd" filter="url(#surface-shadow)"/>
  <text x="257" y="221" fill="#35463a" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">View settings</text><text x="865" y="221" text-anchor="end" fill="#858d85" font-family="Segoe UI,Arial,sans-serif" font-size="9">Adjust the interface or canvas</text>
  <rect x="254" y="234" width="288" height="31" rx="8" fill="#edf4ed" stroke="#c9dacb"/><text x="398" y="254" text-anchor="middle" fill="#49644e" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="650">Interface</text><rect x="549" y="234" width="318" height="31" rx="8" fill="#fafbfa" stroke="#e7ebe7"/><text x="708" y="254" text-anchor="middle" fill="#707a72" font-family="Segoe UI,Arial,sans-serif" font-size="10">Canvas</text><path d="M254 273h613" stroke="#eceee9"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="258" y="296" fill="#64746a" font-size="9" font-weight="700">APPLICATION THEME</text>
    <rect x="255" y="303" width="87" height="31" rx="7" fill="#f4f8f4" stroke="#c9dacb"/><text x="298.5" y="323" text-anchor="middle" fill="#49644e" font-size="9" font-weight="600">System</text><rect x="347" y="303" width="87" height="31" rx="7" fill="#fff" stroke="#e3e7e3"/><text x="390.5" y="323" text-anchor="middle" fill="#68736a" font-size="9">Light</text><rect x="439" y="303" width="87" height="31" rx="7" fill="#fff" stroke="#e3e7e3"/><text x="482.5" y="323" text-anchor="middle" fill="#68736a" font-size="9">Dark</text>
    <text x="258" y="358" fill="#64746a" font-size="9" font-weight="700">ACCENT COLOR</text>
    <g><rect x="255" y="365" width="89" height="26" rx="7" fill="#f6f8f6"/><circle cx="268" cy="378" r="6" fill="#78947b"/><text x="281" y="381" fill="#616b63" font-size="8">Sage</text><rect x="348" y="365" width="89" height="26" rx="7" fill="#fff"/><circle cx="361" cy="378" r="6" fill="#3f78a5"/><text x="374" y="381" fill="#616b63" font-size="8">Ocean</text><rect x="441" y="365" width="85" height="26" rx="7" fill="#fff"/><circle cx="454" cy="378" r="6" fill="#ad6475"/><text x="467" y="381" fill="#616b63" font-size="8">Rose</text></g>
    <text x="558" y="296" fill="#64746a" font-size="9" font-weight="700">TOOLBAR SURFACE</text>
    <g>
      <rect x="556" y="303" width="145" height="29" rx="7" fill="#edf4ed" stroke="#c9dacb"/><circle cx="570" cy="317" r="6" fill="#fafbf9" stroke="#66766a"/><path d="M570 311a6 6 0 0 0 0 12z" fill="#66766a"/><text x="582" y="320" fill="#49644e" font-size="9" font-weight="650">Auto</text>
      <rect x="706" y="303" width="149" height="29" rx="7" fill="#fff"/><circle cx="720" cy="317" r="6" fill="#f8faf7" stroke="#ddd"/><text x="732" y="320" fill="#616b63" font-size="8">Paper</text>
      <rect x="556" y="336" width="145" height="29" rx="7" fill="#fff"/><circle cx="570" cy="350" r="6" fill="#f4efe4" stroke="#d7c9b4"/><text x="582" y="353" fill="#616b63" font-size="9">Warm</text>
      <rect x="706" y="336" width="149" height="29" rx="7" fill="#fff"/><circle cx="720" cy="350" r="6" fill="#e8edf2" stroke="#c9d2dc"/><text x="732" y="353" fill="#616b63" font-size="8">Slate</text>
      <rect x="556" y="369" width="145" height="29" rx="7" fill="#fff"/><circle cx="570" cy="383" r="6" fill="#e8efe9" stroke="#cbd8cd"/><text x="582" y="386" fill="#616b63" font-size="9">Sage</text>
      <rect x="706" y="369" width="149" height="29" rx="7" fill="#fff"/><circle cx="720" cy="383" r="6" fill="#252c31"/><text x="732" y="386" fill="#616b63" font-size="8">Night</text>
      <rect x="556" y="402" width="299" height="29" rx="7" fill="#fff"/><circle cx="570" cy="416" r="6" fill="#9580b8" stroke-dasharray="2 1"/><text x="582" y="419" fill="#616b63" font-size="9">Custom</text>
    </g>
    <text x="558" y="454" fill="#64746a" font-size="9" font-weight="700">COMPONENT STYLE</text><rect x="556" y="461" width="143" height="29" rx="7" fill="#edf4ed" stroke="#c9dacb"/><text x="627.5" y="480" text-anchor="middle" fill="#49644e" font-size="9" font-weight="600">Modern</text><rect x="705" y="461" width="150" height="29" rx="7" fill="#fff" stroke="#e3e7e3"/><text x="780" y="480" text-anchor="middle" fill="#68736a" font-size="9">Simple</text>
  </g>
  <text x="36" y="577" fill="#7a867e" font-family="Segoe UI,Arial,sans-serif" font-size="10">Auto follows the app theme. Pick Paper, Warm, Slate, Sage, Night, or a custom surface to keep the toolbar fixed.</text>
</svg>
