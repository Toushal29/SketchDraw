  <rect x="358" y="323" width="404" height="154" rx="14" fill="#fbfcfb" stroke="#dce3df" filter="url(#shadow)"/>
  <text x="381" y="355" fill="#35463a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">View · Toolbar surface</text>
  <rect x="380" y="373" width="360" height="43" rx="10" fill="#eef5ef" stroke="#c7d8c9"/>
