  <rect x="129" y="135" width="154" height="30" rx="10" fill="#fff" stroke="#eadfdb" filter="url(#view-shadow)"/><circle cx="147" cy="150" r="6" fill="#ef435e" opacity=".8"/><text x="160" y="154" fill="#6e7770" font-family="Segoe UI,Arial,sans-serif" font-size="9">Laser trail fades automatically</text>
  <text x="132" y="233" fill="#7f8c82" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1">RELEASE PLAN</text>
  <rect x="131" y="255" width="208" height="240" rx="16" fill="#fff" stroke="#d9e2da" filter="url(#view-shadow)"/><rect x="131" y="255" width="208" height="49" rx="15" fill="#f4f8f3"/><rect x="131" y="289" width="208" height="15" fill="#f4f8f3"/><text x="150" y="285" fill="#344036" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">Launch notes</text><text x="317" y="284" text-anchor="end" fill="#7d8c7d" font-family="Segoe UI,Arial,sans-serif" font-size="12">⌄</text><path d="M150 320h169" stroke="#e8ede8"/><text x="151" y="347" fill="#405244" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700"># This week</text><text x="151" y="374" fill="#58635a" font-family="Segoe UI,Arial,sans-serif" font-size="10">Confirm the final artwork</text><text x="151" y="397" fill="#58635a" font-family="Segoe UI,Arial,sans-serif" font-size="10">Review the onboarding flow</text><text x="151" y="420" fill="#58635a" font-family="Segoe UI,Arial,sans-serif" font-size="10">Prepare release notes</text><rect x="149" y="441" width="169" height="36" rx="8" fill="#f6f8f6"/><text x="160" y="456" fill="#748076" font-family="Consolas,monospace" font-size="8">const release = "ready";</text><text x="160" y="468" fill="#748076" font-family="Consolas,monospace" font-size="8">// code stays readable</text>
  <rect x="391" y="283" width="248" height="195" rx="15" fill="#fff8df" stroke="#eadb9c" filter="url(#view-shadow)"/><rect x="391" y="283" width="248" height="46" rx="14" fill="#fff5d1"/><rect x="391" y="315" width="248" height="14" fill="#fff5d1"/><text x="411" y="312" fill="#4b4938" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Decisions</text><text x="617" y="311" text-anchor="end" fill="#7e795f" font-family="Segoe UI,Arial,sans-serif" font-size="12">⌃</text><path d="M411 345h207" stroke="#eee4c3"/><text x="412" y="371" fill="#65604d" font-family="Segoe UI,Arial,sans-serif" font-size="10">• Keep the first release focused</text><text x="412" y="395" fill="#65604d" font-family="Segoe UI,Arial,sans-serif" font-size="10">• Collect feedback after launch</text><text x="412" y="419" fill="#65604d" font-family="Segoe UI,Arial,sans-serif" font-size="10">• Review support questions weekly</text><rect x="411" y="438" width="125" height="23" rx="7" fill="#f5edcf"/><text x="473" y="453" text-anchor="middle" fill="#777052" font-family="Segoe UI,Arial,sans-serif" font-size="8" font-weight="600">Tap to collapse card</text>
  <path d="M340 374h43" fill="none" stroke="#79897c" stroke-width="2"/><path d="m375 367 8 7-8 7" fill="none" stroke="#79897c" stroke-width="2"/><rect x="646" y="343" width="179" height="60" rx="13" fill="#fff" stroke="#92a78e" stroke-width="1.4"/><rect x="646" y="343" width="179" height="6" rx="3" fill="#78a27d"/><text x="735" y="378" text-anchor="middle" fill="#354036" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">Publish release</text><text x="735" y="393" text-anchor="middle" fill="#8a958c" font-family="Segoe UI,Arial,sans-serif" font-size="8">Viewer can inspect cards</text>
  <rect x="866" y="145" width="151" height="104" rx="13" fill="#fbfcfb" stroke="#e1e7e2" filter="url(#view-shadow)"/><text x="884" y="171" fill="#425046" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700">Read-only session</text><path d="M884 185h115" stroke="#e7ece7"/><circle cx="889" cy="203" r="3" fill="#78a27d"/><text x="899" y="206" fill="#78847a" font-family="Segoe UI,Arial,sans-serif" font-size="9">Browse the canvas</text><circle cx="889" cy="223" r="3" fill="#78a27d"/><text x="899" y="226" fill="#78847a" font-family="Segoe UI,Arial,sans-serif" font-size="9">Expand and collapse cards</text><circle cx="889" cy="243" r="3" fill="#d39b42"/><text x="899" y="246" fill="#78847a" font-family="Segoe UI,Arial,sans-serif" font-size="9">Laser pointer only</text>
