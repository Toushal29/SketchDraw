  <rect x="21" y="60" width="1038" height="570" rx="15" fill="#fff" stroke="#e0e6e1"/><rect x="22" y="61" width="1036" height="568" rx="14" fill="url(#view-grid)"/>
  <rect x="40" y="79" width="224" height="37" rx="10" fill="#fbfcfb" stroke="#e4e9e5"/><text x="56" y="102" fill="#3d493f" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600">Product launch checklist</text><circle cx="244" cy="97" r="4" fill="#78a37d"/>
