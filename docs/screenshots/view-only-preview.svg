  <rect width="1080" height="660" rx="20" fill="#202620"/><rect x="8" y="8" width="1064" height="644" rx="15" fill="#f4f6f4"/>
  <rect x="8" y="8" width="1064" height="40" rx="15" fill="#fbfcfb"/><rect x="8" y="32" width="1064" height="16" fill="#fbfcfb"/><rect x="23" y="16" width="22" height="22" rx="7" fill="#252822"/><path d="M28 22c3-3 8-3 10-1 2 2 0 4-4 5-4 1-6 2-5 4 2 2 7 2 10 0" fill="none" stroke="#f7f4ec" stroke-width="1.5" stroke-linecap="round"/><circle cx="39" cy="21" r="1.7" fill="#f29a83"/><text x="52" y="32" fill="#3c463f" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="650">Workshop notes.sketch</text>
