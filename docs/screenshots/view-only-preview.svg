<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" role="img" aria-labelledby="title desc">
  <title id="title">Open as view only preview</title>
  <desc id="desc">Illustrative view-only sketch workspace with laser pointer as the only available drawing tool and readable cards that can be expanded or collapsed without saving.</desc>
