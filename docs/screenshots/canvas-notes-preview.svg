<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Modern canvas note, sticky note, and checklist cards</title>
  <desc id="desc">Three clean note cards have custom titles, fixed-size text, syntax-highlighted code in simple appearance, and aligned checklist rows. Card colors adapt to the app light or dark appearance.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="145%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#26352c" flood-opacity=".12"/></filter></defs>
  <rect width="1120" height="520" rx="22" fill="#f2f5f3"/>
  <text x="42" y="50" fill="#64746a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="2">DIRECT CANVAS WRITING</text>
  <text x="42" y="82" fill="#26362d" font-family="Segoe UI, sans-serif" font-size="25" font-weight="650">Notes that stay light and readable</text>
  <rect x="28" y="106" width="1064" height="372" rx="17" fill="#fff" stroke="#e1e7e3"/>
  <g filter="url(#shadow)">
    <rect x="58" y="138" width="316" height="300" rx="13" fill="#fff" stroke="#d9e0e8"/>
    <path d="M60 152v272" stroke="#607d9a" stroke-width="3" stroke-linecap="round"/>
    <rect x="402" y="138" width="316" height="300" rx="13" fill="#fbf7ed" stroke="#e5d9bc"/>
    <path d="M404 152v272" stroke="#9b824d" stroke-width="3" stroke-linecap="round"/>
    <rect x="746" y="138" width="316" height="300" rx="13" fill="#f2f8f4" stroke="#cedfd4"/>
    <path d="M748 152v272" stroke="#56836a" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="80" y="163" fill="#263445" font-family="Segoe UI, sans-serif" font-size="14" font-weight="650">Release outline</text>
  <text x="80" y="183" fill="#738196" font-family="Segoe UI, sans-serif" font-size="9" font-weight="650" letter-spacing=".7">NOTE</text>
  <rect x="338" y="149" width="22" height="22" rx="6" fill="#f4f7fa" stroke="#e8edf2"/><path d="m344 157 5 5 5-5" fill="none" stroke="#738196" stroke-width="1.5"/>
  <path d="M74 198h284" stroke="#e8edf2"/>
  <text x="80" y="217" fill="#263445" font-family="Segoe UI, sans-serif" font-size="12">Keep the decision close to the small</text>
  <text x="80" y="237" fill="#263445" font-family="Segoe UI, sans-serif" font-size="12">implementation details.</text>
  <rect x="77" y="265" width="278" height="132" rx="3" fill="#ffffff" stroke="#c6c6c6"/>
  <text x="91" y="280" fill="#606060" font-family="Segoe UI, sans-serif" font-size="9" font-weight="650">TYPESCRIPT · SIMPLE</text>
  <text x="91" y="307" fill="#2458a8" font-family="Cascadia Code, Consolas, monospace" font-size="12">const</text><text x="130" y="307" fill="#202020" font-family="Cascadia Code, Consolas, monospace" font-size="12">nextStep =</text><text x="218" y="307" fill="#945a16" font-family="Cascadia Code, Consolas, monospace" font-size="12">"review";</text>
  <text x="91" y="332" fill="#2458a8" font-family="Cascadia Code, Consolas, monospace" font-size="12">if</text><text x="108" y="332" fill="#202020" font-family="Cascadia Code, Consolas, monospace" font-size="12">(ready) publish();</text>
  <text x="80" y="420" fill="#738196" font-family="Segoe UI, sans-serif" font-size="9">Light appearance &#183; 12 px text</text>
  <text x="424" y="163" fill="#49402d" font-family="Segoe UI, sans-serif" font-size="14" font-weight="650">Design question</text>
  <text x="424" y="183" fill="#93845f" font-family="Segoe UI, sans-serif" font-size="9" font-weight="650" letter-spacing=".7">STICKY</text>
  <rect x="682" y="149" width="22" height="22" rx="6" fill="#f5eedf" stroke="#eee5d3"/><path d="m688 160 5-5 5 5" fill="none" stroke="#93845f" stroke-width="1.5"/>
  <path d="M418 198h284" stroke="#eee5d3"/>
  <text x="424" y="225" fill="#49402d" font-family="Segoe UI, sans-serif" font-size="14">Which part of the handoff</text>
  <text x="424" y="247" fill="#49402d" font-family="Segoe UI, sans-serif" font-size="14">still needs a clear owner?</text>
  <rect x="424" y="292" width="108" height="25" rx="12" fill="#f5eedf"/><text x="478" y="308" text-anchor="middle" fill="#8c7545" font-family="Segoe UI, sans-serif" font-size="9" font-weight="650">EDIT TITLE</text>
  <text x="424" y="420" fill="#93845f" font-family="Segoe UI, sans-serif" font-size="9">Sticky surface &#183; resize without changing text</text>
  <text x="768" y="163" fill="#2d4035" font-family="Segoe UI, sans-serif" font-size="14" font-weight="650">Review checklist</text>
  <text x="768" y="183" fill="#72897a" font-family="Segoe UI, sans-serif" font-size="9" font-weight="650" letter-spacing=".7">LIST</text>
  <rect x="1026" y="149" width="22" height="22" rx="6" fill="#e9f3ec" stroke="#dfebe2"/><path d="m1032 160 5 5 5-5" fill="none" stroke="#72897a" stroke-width="1.5"/>
  <path d="M762 198h284" stroke="#dfebe2"/>
  <text x="768" y="218" fill="#72897a" font-family="Segoe UI, sans-serif" font-size="10">1 of 3 complete</text>
  <rect x="768" y="236" width="270" height="4" rx="2" fill="#dfebe2"/><rect x="768" y="236" width="90" height="4" rx="2" fill="#4d8965"/>
  <rect x="770" y="258" width="16" height="16" rx="4" fill="#4d8965" stroke="#4d8965"/><path d="m774 266 3 3 5-6" fill="none" stroke="#fff" stroke-width="1.7"/><text x="797" y="260" dominant-baseline="hanging" fill="#72897a" font-family="Segoe UI, sans-serif" font-size="12">Confirm SQL parsing</text><path d="M797 269h136" stroke="#72897a"/>
  <rect x="770" y="292" width="16" height="16" rx="4" fill="#f2f8f4" stroke="#cedfd4"/><text x="797" y="294" dominant-baseline="hanging" fill="#2d4035" font-family="Segoe UI, sans-serif" font-size="12">Check row attachments</text>
  <rect x="770" y="326" width="16" height="16" rx="4" fill="#f2f8f4" stroke="#cedfd4"/><text x="797" y="328" dominant-baseline="hanging" fill="#2d4035" font-family="Segoe UI, sans-serif" font-size="12">Save a preview</text>
  <text x="768" y="420" fill="#72897a" font-family="Segoe UI, sans-serif" font-size="9">Aligned rows &#183; click boxes to track progress</text>
  <text x="42" y="500" fill="#7a867e" font-family="Segoe UI, sans-serif" font-size="10">Simple appearance keeps language syntax colors; text size stays fixed when cards resize.</text>
</svg>
