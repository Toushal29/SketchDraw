<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Canvas notes and checklist preview</title>
  <desc id="desc">Notes, sticky notes, and checklists are written in place on the whiteboard without a separate modal panel.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#303a31" flood-opacity=".14"/></filter></defs>
  <rect width="1120" height="520" rx="22" fill="#f4f6f3"/>
  <text x="42" y="52" fill="#334338" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="2">TEXT · NOTES · CHECKLISTS</text>
  <text x="42" y="84" fill="#26362d" font-family="Segoe UI, sans-serif" font-size="25" font-weight="650">Write right where the idea lives</text>
  <rect x="32" y="110" width="1056" height="366" rx="16" fill="#fff" stroke="#e1e5df"/>
  <g filter="url(#shadow)">
    <rect x="73" y="155" width="306" height="270" rx="14" fill="#edf3fb" stroke="#c8d7eb"/>
    <text x="93" y="180" fill="#718094" font-family="Cascadia Code, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1">NOTE + CODE</text>
    <rect x="316" y="164" width="43" height="23" rx="7" fill="#fff" stroke="#c8d7eb"/>
    <text x="337.5" y="179" text-anchor="middle" fill="#405b76" font-family="Segoe UI, sans-serif" font-size="9" font-weight="650">Done ✓</text>
    <text x="94" y="214" fill="#303d4c" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Release outline</text>
    <text x="94" y="240" fill="#303d4c" font-family="Segoe UI, sans-serif" font-size="12">Keep the small changes close to</text>
    <text x="94" y="260" fill="#303d4c" font-family="Segoe UI, sans-serif" font-size="12">the main design decision.</text>
    <rect x="91" y="278" width="270" height="119" rx="9" fill="#202936" stroke="#354355"/>
    <text x="106" y="299" fill="#92a2b6" font-family="Cascadia Code, Consolas, monospace" font-size="9" font-weight="700">TYPESCRIPT</text>
    <text x="106" y="326" fill="#85b8ee" font-family="Cascadia Code, Consolas, monospace" font-size="12">const</text>
    <text x="145" y="326" fill="#dce5f4" font-family="Cascadia Code, Consolas, monospace" font-size="12">nextStep =</text>
    <text x="226" y="326" fill="#e7b579" font-family="Cascadia Code, Consolas, monospace" font-size="12">"review";</text>
    <text x="106" y="350" fill="#85b8ee" font-family="Cascadia Code, Consolas, monospace" font-size="12">if</text>
    <text x="124" y="350" fill="#dce5f4" font-family="Cascadia Code, Consolas, monospace" font-size="12">(ready) publish();</text>
    <rect x="427" y="170" width="272" height="218" rx="4" fill="#fff1a8" stroke="#e0cc73"/>
    <text x="450" y="203" fill="#837539" font-family="Cascadia Code, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1">STICKY NOTE</text>
    <text x="450" y="241" fill="#514724" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Ask the team</text>
    <text x="450" y="272" fill="#514724" font-family="Segoe UI, sans-serif" font-size="13">Which part of the flow</text>
    <text x="450" y="294" fill="#514724" font-family="Segoe UI, sans-serif" font-size="13">needs a clearer handoff?</text>
    <path d="M450 330h201" stroke="#e1d28a"/>
    <text x="450" y="359" fill="#8a7936" font-family="Segoe UI, sans-serif" font-size="10">Click the paper and type in place.</text>
    <rect x="752" y="155" width="288" height="270" rx="14" fill="#f3f8f3" stroke="#d5e2d6"/>
    <text x="772" y="181" fill="#718575" font-family="Cascadia Code, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1">CHECKLIST</text>
    <text x="961" y="181" fill="#718575" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700">1/3 done</text>
    <rect x="772" y="195" width="248" height="4" rx="2" fill="#d5e2d6"/><rect x="772" y="195" width="83" height="4" rx="2" fill="#75a883"/>
    <rect x="774" y="224" width="17" height="17" rx="4" fill="#75a883" stroke="#75a883"/><path d="m778 232 3 3 6-7" fill="none" stroke="#fff" stroke-width="1.8"/>
    <text x="804" y="238" fill="#89958b" font-family="Segoe UI, sans-serif" font-size="13">Confirm SQL parsing</text>
    <rect x="774" y="264" width="17" height="17" rx="4" fill="#fff" stroke="#8b9d8f"/>
    <text x="804" y="278" fill="#33423a" font-family="Segoe UI, sans-serif" font-size="13">Check row attachments</text>
    <rect x="774" y="304" width="17" height="17" rx="4" fill="#fff" stroke="#8b9d8f"/>
    <text x="804" y="318" fill="#33423a" font-family="Segoe UI, sans-serif" font-size="13">Save a preview</text>
    <text x="772" y="378" fill="#839087" font-family="Segoe UI, sans-serif" font-size="10">Click a checkbox to track progress.</text>
  </g>
  <text x="50" y="451" fill="#6d786f" font-family="Segoe UI, sans-serif" font-size="11">The writing surface stays on the canvas; Done, clicking away, or pressing Ctrl/⌘ + Enter saves it.</text>
</svg>
