<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="540" viewBox="0 0 1040 540" role="img" aria-labelledby="title desc">
  <title id="title">SketchDraw layer panel with arrow ordering controls</title>
  <desc id="desc">A floating Layers panel lists canvas objects in stacking order. Up and down arrows reorder layers while visibility and lock controls stay on each row.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="145%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#26352c" flood-opacity=".13"/></filter></defs>
  <rect width="1040" height="540" rx="24" fill="#f1f4f2"/>
  <text x="40" y="48" fill="#64746a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="2">LAYER MANAGEMENT</text>
  <text x="40" y="82" fill="#26362d" font-family="Segoe UI, sans-serif" font-size="25" font-weight="650">Reorder objects where you can see them</text>
  <rect x="28" y="108" width="984" height="392" rx="18" fill="#fff" stroke="#e1e7e3"/>
  <rect x="50" y="130" width="440" height="348" rx="12" fill="#fbfcfb" stroke="#e6eae7"/>
  <path d="M96 361h250m0 0 12-9m-12 9 12 9" fill="none" stroke="#71869b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="134" y="244" width="226" height="124" rx="15" fill="#e8f1eb" stroke="#68836e" stroke-width="2"/><text x="247" y="287" text-anchor="middle" fill="#344a39" font-family="Segoe UI, sans-serif" font-size="14" font-weight="650">Service</text>
  <path d="m320 238 86-50 87 50-87 50z" fill="#fff4d9" stroke="#aa8b45" stroke-width="2"/><text x="406" y="243" text-anchor="middle" fill="#5f4e27" font-family="Segoe UI, sans-serif" font-size="13">Decision</text>
  <rect x="211" y="335" width="246" height="80" rx="12" fill="#e8eef8" fill-opacity=".9" stroke="#7189a1" stroke-width="2"/><text x="333" y="380" text-anchor="middle" fill="#394f68" font-family="Segoe UI, sans-serif" font-size="14">Selected shape</text>
  <g filter="url(#shadow)"><rect x="516" y="145" width="282" height="316" rx="15" fill="#fff" stroke="#dbe2dd"/></g>
  <text x="538" y="178" fill="#2d3e33" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Layers</text><text x="777" y="178" text-anchor="end" fill="#7b8980" font-family="Segoe UI, sans-serif" font-size="11">4 objects</text>
  <path d="M532 194h250" stroke="#e8ede9"/>
  <g font-family="Segoe UI, sans-serif" font-size="12" fill="#35473a">
    <rect x="531" y="205" width="252" height="48" rx="9" fill="#fff"/><g transform="translate(541 218)" fill="none" stroke="#839087" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m1 7 5-5 5 5M6 2v10m8-1 5 5 5-5m-5 5V6"/></g><text x="575" y="234">Text: Selected shape</text><text x="739" y="234" fill="#738078" font-size="9">Hide</text><text x="774" y="234" text-anchor="end" fill="#738078" font-size="9">Lock</text>
    <rect x="531" y="257" width="252" height="43" rx="9" fill="#f2f6f2" stroke="#dbe6dc"/><g transform="translate(541 267)" fill="none" stroke="#547a5b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m1 7 5-5 5 5M6 2v10m8-1 5 5 5-5m-5 5V6"/></g><text x="575" y="284" font-weight="650">Decision</text><text x="739" y="284" fill="#738078" font-size="9">Hide</text><text x="774" y="284" text-anchor="end" fill="#738078" font-size="9">Lock</text>
    <rect x="531" y="308" width="252" height="43" rx="9" fill="#fff"/><g transform="translate(541 318)" fill="none" stroke="#839087" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m1 7 5-5 5 5M6 2v10m8-1 5 5 5-5m-5 5V6"/></g><text x="575" y="335">Service</text><text x="739" y="335" fill="#738078" font-size="9">Hide</text><text x="774" y="335" text-anchor="end" fill="#738078" font-size="9">Lock</text>
    <rect x="531" y="359" width="252" height="43" rx="9" fill="#fff"/><g transform="translate(541 369)" fill="none" stroke="#839087" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m1 7 5-5 5 5M6 2v10m8-1 5 5 5-5m-5 5V6"/></g><text x="575" y="386">Arrow</text><text x="739" y="386" fill="#738078" font-size="9">Hide</text><text x="774" y="386" text-anchor="end" fill="#738078" font-size="9">Lock</text>
  </g>
  <text x="50" y="522" fill="#7a867e" font-family="Segoe UI, sans-serif" font-size="10">Layers open separately from object properties. Use the up and down arrows to change stacking order.</text>
</svg>
