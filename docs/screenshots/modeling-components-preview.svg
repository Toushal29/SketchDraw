    <path d="M320 270h47"/><path d="m360 264 7 6-7 6"/>
    <path d="M605 257h52"/><path d="m650 251 7 6-7 6"/>
  </g>
  <g transform="translate(903 151)">
    <text x="0" y="0" fill="#607264" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" letter-spacing="1">SEQUENCE PARTS</text>
    <rect x="0" y="22" width="72" height="30" rx="7" fill="#edf4ff" stroke="#7e94ad"/>
    <rect x="112" y="22" width="72" height="30" rx="7" fill="#edf5f0" stroke="#8ba596"/>
    <text x="36" y="41" text-anchor="middle" fill="#456580" font-family="Segoe UI, sans-serif" font-size="10">Client</text>
    <text x="148" y="41" text-anchor="middle" fill="#4c6a59" font-family="Segoe UI, sans-serif" font-size="10">API</text>
    <path d="M36 52v135m112-135v135" stroke="#98a6b2" stroke-width="1.5" stroke-dasharray="5 5"/>
    <rect x="139" y="81" width="18" height="65" rx="3" fill="#d7e6f8" stroke="#6887a6"/>
    <path d="M36 93h112m-6-6 6 6-6 6" stroke="#617a92" stroke-width="2" fill="none"/>
    <text x="90" y="85" text-anchor="middle" fill="#617a92" font-family="Segoe UI, sans-serif" font-size="9">sync message</text>
    <path d="M148 159H36m6-6-6 6 6 6" stroke="#617a92" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
    <text x="91" y="180" text-anchor="middle" fill="#617a92" font-family="Segoe UI, sans-serif" font-size="9">async reply</text>
  </g>
  <text x="50" y="450" fill="#6d786f" font-family="Segoe UI, sans-serif" font-size="11">Insertable UML, ER, and C4 items stay editable as ordinary canvas shapes, text, and connectors.</text>
