<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">UML, ER, and architecture component library preview</title>
  <desc id="desc">A canvas contains reusable UML class and sequence components, a table schema card, and nested C4-style architecture boundaries.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#263329" flood-opacity=".12"/></filter></defs>
  <rect width="1120" height="520" rx="22" fill="#f4f6f3"/>
  <text x="42" y="52" fill="#334338" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="2">MODEL COMPONENT LIBRARY</text>
  <text x="42" y="84" fill="#26362d" font-family="Segoe UI, sans-serif" font-size="25" font-weight="650">Build the diagram one useful piece at a time</text>
  <rect x="32" y="110" width="1056" height="366" rx="16" fill="#fff" stroke="#e1e5df"/>
  <g filter="url(#shadow)">
    <rect x="66" y="144" width="254" height="254" rx="13" fill="#eef4ff" stroke="#7e94ad" stroke-dasharray="7 5"/>
    <text x="82" y="169" fill="#496681" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">SYSTEM CONTEXT</text>
    <rect x="96" y="192" width="197" height="177" rx="10" fill="#f7faff" stroke="#8198b0"/>
    <text x="111" y="215" fill="#456580" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700">CONTAINER BOUNDARY</text>
    <rect x="122" y="239" width="143" height="99" rx="9" fill="#edf5f0" stroke="#8ba596"/>
    <text x="137" y="260" fill="#4c6a59" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700">COMPONENT</text>
    <text x="137" y="286" fill="#65756a" font-family="Segoe UI, sans-serif" font-size="10">API controller</text>
    <text x="137" y="305" fill="#829087" font-family="Segoe UI, sans-serif" font-size="9">Technology: Node.js</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="367" y="144" width="238" height="254" rx="13" fill="#fbfcfe" stroke="#8499ad"/>
    <rect x="367" y="144" width="238" height="44" rx="13" fill="#e8f0fb" stroke="#8499ad"/>
    <text x="486" y="172" text-anchor="middle" fill="#345371" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">OrderService</text>
    <path d="M367 188h238M367 292h238" stroke="#cbd7e2"/>
    <text x="384" y="215" fill="#3d5368" font-family="Cascadia Code, Consolas, monospace" font-size="11">+ id: UUID</text>
    <text x="384" y="238" fill="#3d5368" font-family="Cascadia Code, Consolas, monospace" font-size="11">- status: State</text>
    <text x="384" y="261" fill="#3d5368" font-family="Cascadia Code, Consolas, monospace" font-size="11"># total: Money</text>
    <text x="384" y="318" fill="#3d5368" font-family="Cascadia Code, Consolas, monospace" font-size="11">+ create()</text>
    <text x="384" y="341" fill="#3d5368" font-family="Cascadia Code, Consolas, monospace" font-size="11">- validate()</text>
    <text x="384" y="373" fill="#84909b" font-family="Segoe UI, sans-serif" font-size="9">Class · attributes · methods</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="657" y="144" width="202" height="254" rx="13" fill="#fbfcfe" stroke="#879caf"/>
    <rect x="657" y="144" width="202" height="39" rx="13" fill="#e8f0f7" stroke="#879caf"/>
    <text x="674" y="169" fill="#36556e" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">orders</text>
    <path d="M657 183h202M657 232h202M657 281h202M657 330h202" stroke="#d9e1e7"/>
    <rect x="671" y="197" width="23" height="19" rx="5" fill="#f6edce"/><text x="682.5" y="210" text-anchor="middle" fill="#806d32" font-family="Segoe UI, sans-serif" font-size="8" font-weight="700">PK</text>
    <text x="705" y="211" fill="#34495a" font-family="Cascadia Code, Consolas, monospace" font-size="10">id · INT</text>
    <rect x="671" y="246" width="23" height="19" rx="5" fill="#dcecf3"/><text x="682.5" y="259" text-anchor="middle" fill="#436e85" font-family="Segoe UI, sans-serif" font-size="8" font-weight="700">FK</text>
    <text x="705" y="260" fill="#34495a" font-family="Cascadia Code, Consolas, monospace" font-size="10">user_id</text>
    <text x="674" y="309" fill="#34495a" font-family="Cascadia Code, Consolas, monospace" font-size="10">created_at</text>
    <text x="674" y="357" fill="#82909d" font-family="Segoe UI, sans-serif" font-size="9">INT · TIMESTAMP</text>
