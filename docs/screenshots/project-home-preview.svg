<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">SketchDraw project home with task, notes, and workspace shortcuts</title>
  <desc id="desc">A project dashboard shows project actions, prioritized tasks with dates, recent notes, and shortcuts to the project tools.</desc>
  <rect width="1120" height="640" rx="20" fill="#f4f6f4"/>
  <rect x="22" y="22" width="1076" height="596" rx="17" fill="#fff" stroke="#e1e6e1"/>
  <rect x="22" y="22" width="1076" height="54" rx="17" fill="#fbfcfb"/>
  <path d="M22 76h1076" stroke="#e5e9e5"/>
  <text x="48" y="54" fill="#34453a" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">SketchDraw</text>
  <rect x="802" y="35" width="74" height="29" rx="8" fill="#edf1ed"/><text x="839" y="53" text-anchor="middle" fill="#56645a" font-family="Segoe UI,Arial,sans-serif" font-size="10">Canvas</text>
  <rect x="882" y="35" width="90" height="29" rx="8" fill="#e8efe9"/><text x="927" y="53" text-anchor="middle" fill="#42634a" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700">Planning</text>
  <rect x="978" y="35" width="72" height="29" rx="8" fill="#edf1ed"/><text x="1014" y="53" text-anchor="middle" fill="#56645a" font-family="Segoe UI,Arial,sans-serif" font-size="10">Library</text>
  <text x="60" y="124" fill="#728178" font-family="Segoe UI,Arial,sans-serif" font-size="10" letter-spacing="2">PROJECT HOME</text>
  <text x="60" y="161" fill="#25332a" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="650">Northstar launch</text>
  <text x="60" y="185" fill="#748078" font-family="Segoe UI,Arial,sans-serif" font-size="12">Your project space for decisions, tasks, notes, dates, and the sketch.</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600">
    <rect x="750" y="130" width="95" height="34" rx="9" fill="#fff" stroke="#dfe5df"/><text x="797" y="151" text-anchor="middle" fill="#526057">New note</text>
    <rect x="853" y="130" width="91" height="34" rx="9" fill="#fff" stroke="#dfe5df"/><text x="898" y="151" text-anchor="middle" fill="#526057">Add task</text>
    <rect x="952" y="130" width="114" height="34" rx="9" fill="#41634a"/><text x="1009" y="151" text-anchor="middle" fill="#fff">Add project file</text>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="60" y="221" width="485" height="230" rx="13" fill="#fff" stroke="#e1e6e1"/>
    <text x="82" y="252" fill="#758078" font-size="9" letter-spacing="1.4">NEXT ACTIONS</text>
    <text x="82" y="276" fill="#2b382f" font-size="17" font-weight="650">Tasks to watch</text>
    <text x="507" y="264" text-anchor="end" fill="#53725a" font-size="10">Open board →</text>
    <path d="M82 290h440" stroke="#edf0ed"/>
    <circle cx="91" cy="317" r="5" fill="#c45f56"/><text x="107" y="321" fill="#364239" font-size="11" font-weight="600">Approve final storyboard</text><rect x="423" y="304" width="82" height="24" rx="7" fill="#fff0ee"/><text x="464" y="320" text-anchor="middle" fill="#a64e47" font-size="9">High · Today</text>
    <path d="M82 340h440" stroke="#edf0ed"/><circle cx="91" cy="367" r="5" fill="#d29a3d"/><text x="107" y="371" fill="#364239" font-size="11" font-weight="600">Prepare launch checklist</text><rect x="423" y="354" width="82" height="24" rx="7" fill="#fff6e7"/><text x="464" y="370" text-anchor="middle" fill="#98702b" font-size="9">Medium · Fri</text>
    <path d="M82 390h440" stroke="#edf0ed"/><circle cx="91" cy="417" r="5" fill="#567a61"/><text x="107" y="421" fill="#364239" font-size="11" font-weight="600">Review export sizes</text><rect x="423" y="404" width="82" height="24" rx="7" fill="#f0f4f0"/><text x="464" y="420" text-anchor="middle" fill="#66736a" font-size="9">Low · Jun 18</text>
    <rect x="565" y="221" width="495" height="230" rx="13" fill="#fff" stroke="#e1e6e1"/>
    <text x="587" y="252" fill="#758078" font-size="9" letter-spacing="1.4">IDEAS &amp; DETAILS</text>
    <text x="587" y="276" fill="#2b382f" font-size="17" font-weight="650">Recent notes</text>
    <text x="1022" y="264" text-anchor="end" fill="#53725a" font-size="10">All notes →</text>
    <path d="M587 290h451" stroke="#edf0ed"/>
    <rect x="587" y="306" width="451" height="55" rx="8" fill="#fbfcfb"/>
    <text x="602" y="328" fill="#364239" font-size="11" font-weight="650">Audience and tone</text><text x="602" y="346" fill="#7a847d" font-size="10">Keep the first run calm and easy to follow.</text>
    <rect x="587" y="373" width="451" height="55" rx="8" fill="#fbfcfb"/>
    <text x="602" y="395" fill="#364239" font-size="11" font-weight="650">Open questions</text><text x="602" y="413" fill="#7a847d" font-size="10">Confirm which export presets ship in the first release.</text>
  </g>
  <text x="60" y="484" fill="#758078" font-family="Segoe UI,Arial,sans-serif" font-size="9" letter-spacing="1.4">PROJECT TOOLS</text>
  <g font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(60 499)"><rect width="235" height="73" rx="11" fill="#fbfcfb" stroke="#e1e6e1"/><rect x="14" y="16" width="34" height="34" rx="10" fill="#edf3ed"/><path d="M25 25h12m-12 6h12m-12 6h8" stroke="#55745c" stroke-width="1.5" stroke-linecap="round"/><text x="60" y="32" fill="#344239" font-size="12" font-weight="650">Tasks &amp; Kanban</text><text x="60" y="49" fill="#79847c" font-size="10">Priorities and stages</text></g>
    <g transform="translate(310 499)"><rect width="235" height="73" rx="11" fill="#fbfcfb" stroke="#e1e6e1"/><rect x="14" y="16" width="34" height="34" rx="10" fill="#edf3ed"/><path d="M24 26h15m-15 6h15m-15 6h10" stroke="#55745c" stroke-width="1.5" stroke-linecap="round"/><text x="60" y="32" fill="#344239" font-size="12" font-weight="650">Project notes</text><text x="60" y="49" fill="#79847c" font-size="10">Keep decisions close</text></g>
    <g transform="translate(560 499)"><rect width="235" height="73" rx="11" fill="#fbfcfb" stroke="#e1e6e1"/><rect x="14" y="16" width="34" height="34" rx="10" fill="#edf3ed"/><path d="M25 25h12v15H25zm3 4h6m-6 4h6" fill="none" stroke="#55745c" stroke-width="1.5" stroke-linejoin="round"/><text x="60" y="32" fill="#344239" font-size="12" font-weight="650">Timeline &amp; calendar</text><text x="60" y="49" fill="#79847c" font-size="10">Dates and milestones</text></g>
    <g transform="translate(810 499)"><rect width="250" height="73" rx="11" fill="#fbfcfb" stroke="#e1e6e1"/><rect x="14" y="16" width="34" height="34" rx="10" fill="#edf3ed"/><path d="M24 25h15v14H24zm3-3v6m9-6v6" fill="none" stroke="#55745c" stroke-width="1.5" stroke-linejoin="round"/><text x="60" y="32" fill="#344239" font-size="12" font-weight="650">Decisions &amp; files</text><text x="60" y="49" fill="#79847c" font-size="10">Risks, links, attachments</text></g>
  </g>
</svg>
