    <rect x="78" y="261" width="541" height="88" rx="16" fill="#fff" stroke="#dce6dd"/><rect x="94" y="278" width="51" height="51" rx="14" fill="#edf4ed" stroke="#dbe9dd"/><path d="M119 291v25m-12.5-12.5h25" stroke="#557b5d" stroke-width="2" stroke-linecap="round"/><text x="164" y="299" fill="#303a33" font-size="15" font-weight="700">New sketch</text><text x="164" y="321" fill="#879188" font-size="11">Start with a blank canvas</text><path d="M576 299h18m-7-7 7 7-7 7" fill="none" stroke="#929c93" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="78" y="365" width="541" height="88" rx="16" fill="#fff" stroke="#dce6dd"/><rect x="94" y="382" width="51" height="51" rx="14" fill="#eef2f4" stroke="#dfe7e9"/><path d="M104 395a3 3 0 0 1 3-3h10l5 5h12a3 3 0 0 1 3 3v15a3 3 0 0 1-3 3h-27a3 3 0 0 1-3-3zM104 399h33" fill="none" stroke="#637782" stroke-width="1.7" stroke-linejoin="round"/><text x="164" y="403" fill="#303a33" font-size="15" font-weight="700">Open a sketch</text><text x="164" y="425" fill="#879188" font-size="11">Browse for a file on this device</text><path d="M576 403h18m-7-7 7 7-7 7" fill="none" stroke="#929c93" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
