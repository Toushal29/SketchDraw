    <text x="72" y="817" fill="#9a9f98" font-size="9">© 2026 Toushal Sampat. All rights reserved.</text>

    <rect x="482" y="132" width="366" height="570" rx="20" fill="#f4f7f2" stroke="#e6ebe3"/>
    <text x="507" y="160" fill="#718171" font-size="9" font-weight="700" letter-spacing="1.4">SKETCHDRAW CANVAS</text><rect x="788" y="145" width="37" height="22" rx="8" fill="#fff" stroke="#e6ebe3"/><text x="806.5" y="160" text-anchor="middle" fill="#78857b" font-size="8">FLOW 01</text>
