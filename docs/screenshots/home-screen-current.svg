    <rect x="28" y="92" width="866" height="756" rx="28" fill="url(#home-card)" stroke="#e5e9e2" filter="url(#home-shadow)"/>
    <rect x="72" y="131" width="49" height="49" rx="15" fill="#eff5ec" stroke="#dce7da"/><path d="M96.5 143v25m-12.5-12.5h25m-21.2-8.8 17.6 17.6m0-17.6-17.6 17.6" stroke="#6a8267" stroke-width="1.6" stroke-linecap="round"/>
    <text x="72" y="215" fill="#7d897c" font-size="10" font-weight="700" letter-spacing="1.7">YOUR IDEAS, ON ONE CANVAS</text>
    <text x="72" y="282" fill="#26342c" font-size="49" font-weight="650" letter-spacing="-2.4">Think it through.</text><text x="72" y="338" fill="#70896f" font-size="50" font-style="italic" font-family="Georgia,serif">Draw it out.</text>
    <text x="72" y="383" fill="#777f77" font-size="14">A calm, capable space for diagrams, plans, and the</text><text x="72" y="405" fill="#777f77" font-size="14">ideas in between. Start a sketch or pick up where you left off.</text>
    <rect x="72" y="438" width="190" height="48" rx="11" fill="#527257"/><text x="94" y="468" fill="#fff" font-size="13" font-weight="700">Create a sketch</text><path d="M230 462h17m-6-6 6 6-6 6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="272" y="438" width="146" height="48" rx="11" fill="#fff" stroke="#e2e7df"/><text x="295" y="468" fill="#4e5b50" font-size="13" font-weight="600">Open a file</text>
