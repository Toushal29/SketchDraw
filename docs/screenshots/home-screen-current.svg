<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc">
  <title id="title">SketchDraw desktop launch screen</title>
  <desc id="desc">Current desktop launch layout with File and View menus, a welcome card, Create a sketch and Open a file actions, a sample flowchart illustration, and recent sketches.</desc>
  <defs>
    <linearGradient id="home-canvas" x2="0" y2="1"><stop stop-color="#f7f8f6"/><stop offset="1" stop-color="#eef1ed"/></linearGradient>
    <linearGradient id="home-card" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f7f8f3"/></linearGradient>
    <filter id="home-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#344236" flood-opacity=".09"/></filter>
  </defs>
  <rect width="1440" height="880" rx="20" fill="#232821"/><rect x="8" y="8" width="1424" height="864" rx="15" fill="url(#home-canvas)"/>
  <rect x="8" y="8" width="1424" height="60" rx="15" fill="#fbfcfb"/><rect x="8" y="51" width="1424" height="17" fill="#fbfcfb"/><path d="M8 68h1424" stroke="#e2e7e2"/>
  <rect x="25" y="22" width="29" height="29" rx="8" fill="#252822"/><path d="M31 29c3-4 12-4 15-1 2 3 0 5-5 7-5 1-7 3-5 6 2 3 9 3 13 0" fill="none" stroke="#f7f4ec" stroke-width="2" stroke-linecap="round"/><circle cx="48" cy="29" r="2.4" fill="#f29a83"/><text x="64" y="41" fill="#303a33" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">SketchDraw</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#566258">
    <rect x="260" y="18" width="58" height="35" rx="9" fill="#edf2ee"/><text x="289" y="40" text-anchor="middle">File</text><path d="m308 33 4 4 4-4" fill="none" stroke="#647267" stroke-width="1.3"/>
    <rect x="324" y="18" width="62" height="35" rx="9" fill="#edf2ee"/><text x="355" y="40" text-anchor="middle">View</text><path d="m375 33 4 4 4-4" fill="none" stroke="#647267" stroke-width="1.3"/>
  </g>
  <g fill="none" stroke="#79857b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
