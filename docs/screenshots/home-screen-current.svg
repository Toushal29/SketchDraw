    <g fill="#58665a" font-size="9" font-weight="650" text-anchor="middle"><text x="551" y="278">Plan</text><text x="685" y="278">Choose</text><text x="800" y="278">Review</text><text x="551" y="404">Write</text><text x="685" y="404">Build</text><text x="800" y="404">Share</text></g>
    <circle cx="814" cy="214" r="11" fill="#eff5ec"/><path d="M814 207v14m-7-7h14m-12-5 10 10m0-10-10 10" stroke="#88a17e" stroke-width="1.2"/>
    <rect x="505" y="734" width="320" height="40" rx="10" fill="#f4f7f2"/><text x="525" y="759" fill="#78877a" font-size="11">A little clarity, one connection at a time.</text>

    <rect x="922" y="92" width="490" height="756" rx="24" fill="#fff" stroke="#e7ebe5" filter="url(#home-shadow)"/>
    <text x="953" y="131" fill="#879087" font-size="9" font-weight="700" letter-spacing="1.5">YOUR WORKSPACE</text><text x="953" y="164" fill="#313a32" font-size="21" font-weight="650">Recent sketches</text><rect x="1352" y="137" width="29" height="29" rx="10" fill="#f5f8f2" stroke="#e4eae1"/><text x="1366.5" y="156" text-anchor="middle" fill="#657b65" font-size="10">3</text><text x="953" y="188" fill="#8a9189" font-size="11">Pick up right where you left off.</text><path d="M953 207h428" stroke="#edf0eb"/>
