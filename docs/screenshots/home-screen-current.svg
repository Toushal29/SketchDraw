<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">SketchDraw desktop home screen preview</title>
  <desc id="desc">Illustrative desktop launch screen with a current menu bar, create and open actions, a recent sketches list, and local file privacy note.</desc>
  <defs><filter id="home-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#26352c" flood-opacity=".08"/></filter></defs>
  <rect width="1280" height="760" rx="20" fill="#202620"/><rect x="8" y="8" width="1264" height="744" rx="15" fill="#f4f6f4"/>
  <rect x="8" y="8" width="1264" height="62" rx="15" fill="#fbfcfb"/><rect x="8" y="52" width="1264" height="18" fill="#fbfcfb"/><path d="M8 70h1264" stroke="#e1e7e2"/>
  <rect x="27" y="22" width="28" height="28" rx="8" fill="#252822"/><path d="M33 29c3-4 12-4 14-1 3 3 0 5-5 7-5 1-8 3-6 6 2 3 9 3 13 0" fill="none" stroke="#f7f4ec" stroke-width="2" stroke-linecap="round"/><circle cx="49" cy="29" r="2.4" fill="#f29a83"/><text x="64" y="41" fill="#303a33" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">SketchDraw</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#566258" text-anchor="middle"><rect x="1010" y="19" width="57" height="34" rx="9" fill="#edf2ee"/><text x="1038" y="40">File⌄</text><rect x="1073" y="19" width="60" height="34" rx="9" fill="#edf2ee"/><text x="1103" y="40">View⌄</text><rect x="1139" y="19" width="57" height="34" rx="9" fill="#edf2ee"/><text x="1167" y="40">Help⌄</text><rect x="1202" y="19" width="54" height="34" rx="9" fill="#fff" stroke="#dfe6e0"/><text x="1229" y="40">Settings</text></g>
  <g font-family="Segoe UI,Arial,sans-serif"><rect x="50" y="111" width="1180" height="598" rx="23" fill="#fff" stroke="#dfe6e0" filter="url(#home-shadow)"/>
    <rect x="78" y="145" width="7" height="7" rx="4" fill="#6d9875"/><text x="94" y="153" fill="#758379" font-size="10" font-weight="700" letter-spacing="1.2">SKETCHDRAW WORKSPACE</text>
