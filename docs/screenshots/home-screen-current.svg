<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">SketchDraw welcome screen preview</title>
  <desc id="desc">SketchDraw launch page with create and open actions and a recent sketches browser.</desc>
  <rect width="1280" height="760" rx="18" fill="#f8f8f5"/><rect x="1" y="1" width="1278" height="758" rx="17" fill="none" stroke="#deded8"/>
  <rect width="1280" height="60" rx="18" fill="#fff"/><path d="M0 60h1280" stroke="#e7e6df"/><rect x="28" y="15" width="30" height="30" rx="9" fill="#30332e"/><path d="M35 36c2-11 15-13 16-5 1 6-8 10-12 3 1-5 6-6 9-4" fill="none" stroke="#f4f3ed" stroke-width="2.2" stroke-linecap="round"/><text x="69" y="36" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#30332e">SketchDraw</text><text x="1120" y="35" font-family="Arial,sans-serif" font-size="12" fill="#81837a">FILE BASED · PRIVATE BY DESIGN</text>
  <g font-family="Arial,sans-serif"><rect x="54" y="176" width="42" height="42" rx="13" fill="#e9ede4"/><path d="M75 186v22m-11-11h22m-19-8 16 16m0-16-16 16" stroke="#75806d" stroke-width="1.5"/><text x="54" y="254" font-size="10" letter-spacing="2.2" fill="#818a78">A QUIET PLACE TO THINK</text><text x="54" y="323" font-size="48" letter-spacing="-2" fill="#292b28">Make space for</text><text x="54" y="376" font-family="Georgia,serif" font-style="italic" font-size="45" fill="#78836c">your next idea.</text><text x="56" y="420" font-size="15" fill="#686a64">A simple, private canvas saved as a file on your device.</text><text x="56" y="445" font-size="15" fill="#686a64">Keep it in any folder, including your cloud drive.</text><rect x="55" y="482" width="172" height="48" rx="9" fill="#30332e"/><text x="74" y="511" font-size="14" font-weight="700" fill="#fff">Create new file</text><path d="m203 500 7 6-7 6" fill="none" stroke="#fff" stroke-width="1.6"/><rect x="239" y="482" width="144" height="48" rx="9" fill="#fff" stroke="#dddcd5"/><text x="264" y="511" font-size="14" fill="#343632">Open a sketch</text><rect x="55" y="567" width="35" height="35" rx="8" fill="#fff" stroke="#e1e0da"/><path d="M66 575h9l5 5v13H66zM75 575v6h5" fill="none" stroke="#88917f"/><text x="102" y="583" font-size="12" font-weight="700" fill="#393b37">Your work stays yours</text><text x="102" y="601" font-size="12" fill="#73756f">Saved locally as a portable .sketch file.</text></g>
  <rect x="633" y="132" width="593" height="548" rx="26" fill="#fff" stroke="#deded8"/><text x="666" y="171" font-family="Arial,sans-serif" font-size="10" letter-spacing="2" fill="#82877c">FILE BROWSER</text><text x="666" y="207" font-family="Georgia,serif" font-size="27" fill="#30332e">Recent sketches</text><path d="M666 226h526" stroke="#ecebe6"/><rect x="666" y="256" width="526" height="350" rx="17" fill="#fafaf8" stroke="#ecebe6" stroke-dasharray="4 5"/><path d="M900 364h60v78h-60zM915 348h60v78" fill="#fff" stroke="#a1a795" stroke-width="2"/><text x="862" y="472" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#454741">No recent sketches yet</text><text x="844" y="499" font-family="Arial,sans-serif" font-size="13" fill="#85877f">Create a new file or browse for a sketch.</text><rect x="834" y="526" width="188" height="39" rx="9" fill="#fff" stroke="#dcdbd4"/><text x="869" y="551" font-family="Arial,sans-serif" font-size="12" fill="#50524c">Browse for a file</text>
</svg>
