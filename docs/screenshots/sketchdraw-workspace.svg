  </g>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="560" y="312" width="180" height="112" rx="20" fill="#edf5f1" stroke="#9abbac" stroke-width="2"/>
    <text x="650" y="355" font-size="13" fill="#45594d">Start with a</text><text x="650" y="376" font-size="16" font-weight="700" fill="#34483d">small idea</text><text x="650" y="399" font-size="11" fill="#75857a">Write it down</text>
    <rect x="770" y="312" width="180" height="112" rx="8" fill="#fff3dc" stroke="#e2bd72" stroke-width="2"/>
    <text x="860" y="355" font-size="13" fill="#725b32">What matters</text><text x="860" y="378" font-size="16" font-weight="700" fill="#594421">right now?</text><text x="860" y="400" font-size="11" fill="#93815e">Choose a direction</text>
    <path d="M1010 312h142l38 56-38 56h-142l-38-56z" fill="#e8effa" stroke="#9db5d5" stroke-width="2"/>
    <text x="1080" y="355" font-size="13" fill="#4e6480">Try it</text><text x="1080" y="378" font-size="16" font-weight="700" fill="#3c5575">and learn</text><text x="1080" y="400" font-size="11" fill="#7287a1">Keep it flexible</text>
    <rect x="756" y="514" width="210" height="102" rx="30" fill="#f8e8e6" stroke="#dfa6a1" stroke-width="2"/>
    <text x="861" y="555" font-size="13" fill="#825b57">Make room to</text><text x="861" y="579" font-size="16" font-weight="700" fill="#744440">change course</text><text x="861" y="598" font-size="11" fill="#a07873">Nothing is final</text>
    <text x="655" y="462" font-size="10" fill="#7a817b">yes</text><text x="902" y="462" font-size="10" fill="#7a817b">explore</text>
  </g>
  <rect x="1190" y="812" width="220" height="50" rx="11" fill="#fff" stroke="#e3e1db"/><circle cx="1214" cy="837" r="3" fill="#c9cbc5"/><circle cx="1227" cy="837" r="3" fill="#c9cbc5"/><circle cx="1240" cy="837" r="3" fill="#c9cbc5"/><text x="1260" y="841" font-family="Arial,sans-serif" font-size="11" fill="#777a72">−   100%   +</text>
