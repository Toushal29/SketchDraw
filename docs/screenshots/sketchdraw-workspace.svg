    <g font-family="Arial,sans-serif" font-size="9" text-anchor="middle"><rect x="38" y="267" width="46" height="55" rx="7" fill="#f7f8fa" stroke="#e9e9e6"/><rect x="90" y="267" width="46" height="55" rx="7" fill="#edf3fb" stroke="#a6bad3"/><rect x="142" y="267" width="46" height="55" rx="7" fill="#f7f8fa" stroke="#e9e9e6"/><rect x="194" y="267" width="46" height="55" rx="7" fill="#f7f8fa" stroke="#e9e9e6"/><rect x="246" y="267" width="46" height="55" rx="7" fill="#f7f8fa" stroke="#e9e9e6"/><text x="61" y="306" fill="#64665f">1 px</text><text x="113" y="306" fill="#49658a">2 px</text><text x="165" y="306" fill="#64665f">4 px</text><text x="217" y="306" fill="#64665f">5 px</text><text x="269" y="306" fill="#64665f">10 px</text></g>
