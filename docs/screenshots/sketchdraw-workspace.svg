<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">SketchDraw workspace preview</title>
  <desc id="desc">A desktop sketch workspace showing floating drawing tools, a style panel, a grid canvas, and a colorful flowchart.</desc>
  <defs>
    <linearGradient id="background" x2="0" y2="1"><stop stop-color="#f8f7f3"/><stop offset="1" stop-color="#eeede8"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d8d7d1"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#29302a" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#707c76" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1440" height="900" rx="24" fill="url(#background)"/>
  <rect x="1" y="1" width="1438" height="898" rx="23" fill="none" stroke="#deddd7"/>
  <rect x="1" y="1" width="1438" height="64" rx="23" fill="#fff"/>
  <path d="M1 64h1438" stroke="#e6e4dd"/>
  <rect x="22" y="16" width="32" height="32" rx="10" fill="#252822"/>
  <path d="M31 26c4-4 12-3 14 0 2 4-6 5-10 7-5 2-4 8 2 9 4 1 8 0 11-2" fill="none" stroke="#f7f4ec" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="47" cy="24" r="3" fill="#f29a83"/>
  <text x="65" y="37" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#292b26">SketchDraw</text>
  <g fill="#71736c" font-family="Arial,sans-serif" font-size="12"><text x="180" y="37">File</text><text x="220" y="37">Edit</text><text x="260" y="37">View</text><text x="310" y="37">Export</text></g>
  <circle cx="1338" cy="32" r="4" fill="#70a581"/><text x="1350" y="36" font-family="Arial,sans-serif" font-size="11" fill="#71736c">12:34</text>
  <rect x="1" y="65" width="1438" height="834" fill="url(#dots)"/>
  <g filter="url(#shadow)">
