    <path d="M18 484h294" stroke="#eee"/><text x="39" y="516" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#4b4d47">Selection</text><text x="39" y="546" font-family="Arial,sans-serif" font-size="11" fill="#71736c">Opacity</text><path d="M96 543h175" stroke="#dedfd9" stroke-width="4" stroke-linecap="round"/><path d="M96 543h151" stroke="#779a89" stroke-width="4" stroke-linecap="round"/><circle cx="247" cy="543" r="6" fill="#779a89"/>
  </g>
  <g filter="url(#shadow)">
