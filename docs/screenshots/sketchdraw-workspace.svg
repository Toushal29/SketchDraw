    <g stroke="#555850" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M520 101v23m-8-8 8 8 8-8"/><path d="M563 104 579 120m0-16-16 16"/><path d="M610 104h19v19h-19z"/><circle cx="664" cy="114" r="10"/><path d="M704 123 724 103m-13 1 13-1-1 13"/><path d="M750 123h22l-11-19z"/><path d="M809 122c5-15 10 6 16-10s10 8 16-5"/><path d="M866 103h19v20h-19zM890 102l12 12-12 12"/>
