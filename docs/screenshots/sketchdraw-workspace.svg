    <g><circle cx="48" cy="195" r="12" fill="#252525"/><circle cx="82" cy="195" r="12" fill="#e76b62"/><circle cx="116" cy="195" r="12" fill="#6b91c9"/><circle cx="150" cy="195" r="12" fill="#74a582"/><circle cx="184" cy="195" r="12" fill="#d8a448"/><circle cx="218" cy="195" r="12" fill="#a581bb"/></g>
    <path d="M18 220h294" stroke="#eee"/>
