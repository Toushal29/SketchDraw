  <text x="60" y="173" fill="#77827a" font-family="Segoe UI,Arial,sans-serif" font-size="11">A single, focused space for quick notes saved with this document.</text>
  <rect x="838" y="127" width="90" height="34" rx="9" fill="#fff" stroke="#dfe5df"/>
  <text x="873" y="148" text-anchor="middle" fill="#4e5c52" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="650">Notes</text><rect x="899" y="136" width="18" height="16" rx="8" fill="#f0f3f0"/><text x="908" y="147" text-anchor="middle" fill="#6d786f" font-family="Segoe UI,Arial,sans-serif" font-size="9">6</text>
  <rect x="938" y="127" width="115" height="34" rx="9" fill="#41634a"/><text x="995" y="148" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="650">New note</text>
  <rect x="60" y="204" width="640" height="360" rx="13" fill="#fff" stroke="#e1e6e1"/>
  <text x="84" y="236" fill="#77827a" font-family="Segoe UI,Arial,sans-serif" font-size="9" letter-spacing="1.6">NOTE</text>
  <text x="676" y="236" text-anchor="end" fill="#858f87" font-family="Segoe UI,Arial,sans-serif" font-size="9">Updated today, 10:24</text>
  <rect x="604" y="248" width="72" height="28" rx="7" fill="#fff" stroke="#dfe5df"/><text x="640" y="266" text-anchor="middle" fill="#526057" font-family="Segoe UI,Arial,sans-serif" font-size="9">Export note</text>
  <path d="M84 290h592" stroke="#edf0ed"/>
  <text x="84" y="326" fill="#29372e" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600">Research ideas</text>
  <text x="84" y="363" fill="#46534a" font-family="Segoe UI,Arial,sans-serif" font-size="12">Questions to follow up</text>
  <text x="84" y="392" fill="#737e76" font-family="Segoe UI,Arial,sans-serif" font-size="11">• Compare the new paper textures on a tablet.</text>
  <text x="84" y="414" fill="#737e76" font-family="Segoe UI,Arial,sans-serif" font-size="11">• Try the project board with a sample .sketch file.</text>
  <text x="84" y="436" fill="#737e76" font-family="Segoe UI,Arial,sans-serif" font-size="11">• Keep the canvas tools easy to reach in portrait.</text>
