  <text x="50" y="57" fill="#334238" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">Personal library</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="10">
    <rect x="230" y="36" width="90" height="28" rx="8" fill="#e8efe9"/><text x="275" y="54" text-anchor="middle" fill="#42634a" font-weight="700">Notepad  6</text>
    <text x="352" y="54" fill="#657168">Study</text><text x="426" y="54" fill="#657168">Wiki</text><text x="482" y="54" fill="#657168">Journal</text><text x="556" y="54" fill="#657168">Writing</text><text x="633" y="54" fill="#657168">Research</text><text x="714" y="54" fill="#657168">Media log</text>
