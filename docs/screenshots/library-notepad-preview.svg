<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">SketchDraw Library Notepad with a note list and Markdown export</title>
  <desc id="desc">The personal library opens to a focused note editor; its Notes dialog lists saved notes and provides open, delete, and export actions.</desc>
  <rect width="1120" height="640" rx="20" fill="#f3f5f3"/>
  <rect x="24" y="24" width="1072" height="592" rx="16" fill="#fff" stroke="#e1e6e1"/>
  <rect x="24" y="24" width="1072" height="54" rx="16" fill="#fbfcfb"/>
