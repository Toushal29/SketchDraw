<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Windows stylus input preview</title>
  <desc id="desc">The pen tool uses WebView2 pressure and tilt pointer data and can use a compatible pen's eraser end.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#273428" flood-opacity=".12"/></filter></defs>
  <rect width="1120" height="520" rx="22" fill="#f4f6f3"/>
  <text x="42" y="52" fill="#334338" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="2">WINDOWS PEN INPUT</text>
  <text x="42" y="84" fill="#26362d" font-family="Segoe UI, sans-serif" font-size="25" font-weight="650">Natural strokes, tuned to the pen in your hand</text>
  <rect x="32" y="110" width="1056" height="366" rx="16" fill="#fff" stroke="#e1e5df"/>
  <text x="70" y="153" fill="#657367" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">PRESSURE VARIES THE STROKE WIDTH</text>
  <path d="M78 242 C140 163 190 304 264 215 S385 169 443 232 S560 291 625 206 S746 176 815 247" fill="none" stroke="#456b52" stroke-width="8" stroke-linecap="round"/>
  <path d="M78 242 C140 163 190 304 264 215 S385 169 443 232 S560 291 625 206 S746 176 815 247" fill="none" stroke="#456b52" stroke-width="2" stroke-linecap="round" opacity=".35"/>
  <text x="76" y="325" fill="#859087" font-family="Segoe UI, sans-serif" font-size="10">light pressure</text>
  <circle cx="129" cy="298" r="2" fill="#56765d"/><circle cx="177" cy="288" r="4" fill="#56765d"/><circle cx="226" cy="272" r="7" fill="#56765d"/><circle cx="285" cy="260" r="10" fill="#56765d"/>
  <text x="313" y="325" fill="#859087" font-family="Segoe UI, sans-serif" font-size="10">firm pressure</text>
  <path d="M636 300h188" stroke="#dde4dc"/>
  <text x="637" y="326" fill="#657367" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" letter-spacing="1.3">TILT SHAPING</text>
  <ellipse cx="675" cy="369" rx="17" ry="8" transform="rotate(-35 675 369)" fill="#60826a"/>
  <ellipse cx="733" cy="369" rx="19" ry="7" transform="rotate(-8 733 369)" fill="#60826a"/>
  <ellipse cx="791" cy="369" rx="17" ry="8" transform="rotate(34 791 369)" fill="#60826a"/>
  <g filter="url(#shadow)">
    <rect x="867" y="138" width="188" height="264" rx="14" fill="#fff" stroke="#dfe5dd"/>
    <text x="887" y="171" fill="#526d59" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Windows pen</text>
    <rect x="886" y="192" width="16" height="16" rx="4" fill="#63896b"/><path d="m890 200 3 3 6-7" fill="none" stroke="#fff" stroke-width="1.7"/>
    <text x="912" y="204" fill="#414c44" font-family="Segoe UI, sans-serif" font-size="11">Pressure width</text>
    <rect x="886" y="231" width="16" height="16" rx="4" fill="#63896b"/><path d="m890 239 3 3 6-7" fill="none" stroke="#fff" stroke-width="1.7"/>
    <text x="912" y="243" fill="#414c44" font-family="Segoe UI, sans-serif" font-size="11">Tilt shaping</text>
    <rect x="886" y="270" width="16" height="16" rx="4" fill="#63896b"/><path d="m890 278 3 3 6-7" fill="none" stroke="#fff" stroke-width="1.7"/>
    <text x="912" y="282" fill="#414c44" font-family="Segoe UI, sans-serif" font-size="11">Eraser end</text>
    <path d="M887 311h148" stroke="#e6eae4"/>
    <text x="887" y="338" fill="#778479" font-family="Segoe UI, sans-serif" font-size="9">Pointer pressure, tilt, and</text>
    <text x="887" y="354" fill="#778479" font-family="Segoe UI, sans-serif" font-size="9">eraser data are saved with</text>
    <text x="887" y="370" fill="#778479" font-family="Segoe UI, sans-serif" font-size="9">the stroke in the sketch.</text>
  </g>
  <text x="50" y="451" fill="#6d786f" font-family="Segoe UI, sans-serif" font-size="11">Windows stylus data comes through WebView2 pointer events; mouse drawing remains unchanged.</text>
</svg>
