<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 900" role="img" aria-labelledby="title desc">
  <title id="title">SketchDraw mobile home preview</title>
  <desc id="desc">Portrait phone preview of the SketchDraw mobile home screen, with new and open actions and a persistent recent sketches list.</desc>
