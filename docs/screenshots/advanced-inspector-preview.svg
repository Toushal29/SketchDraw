<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Contextual Properties panel</title>
  <desc id="desc">The selected Markdown note card has a focused Properties panel with a collapse control, title field, conversion action, and editing guidance. Layers opens separately from the canvas toolbar.</desc>
  <defs><pattern id="property-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0v20" fill="none" stroke="#edf0ec"/></pattern><filter id="property-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#26352c" flood-opacity=".09"/></filter></defs>
  <rect width="1120" height="560" rx="24" fill="#f1f4f2"/><text x="36" y="44" fill="#64746a" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.7">CONTEXTUAL CONTROLS</text><text x="36" y="77" fill="#26362d" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Properties follow the selection</text>
  <rect x="24" y="101" width="1072" height="430" rx="18" fill="#fff" stroke="#e1e7e3"/>
  <rect x="39" y="116" width="294" height="400" rx="14" fill="#fff" stroke="#e1e7e2" filter="url(#property-shadow)"/>
  <text x="58" y="148" fill="#2f3b32" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Properties</text><rect x="237" y="128" width="77" height="27" rx="8" fill="#f1f5f1" stroke="#dfe7e0"/><text x="275.5" y="145" text-anchor="middle" fill="#57715b" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="600">Quick style</text><path d="M57 166h258" stroke="#e8ede8"/>
  <text x="58" y="194" fill="#3d4b40" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="650">Markdown</text><rect x="234" y="177" width="80" height="26" rx="7" fill="#f7f9f7" stroke="#dfe7e2"/><text x="274" y="194" text-anchor="middle" fill="#65786a" font-family="Segoe UI,Arial,sans-serif" font-size="9">Collapse</text>
  <text x="58" y="232" fill="#78857d" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="650">TITLE</text><rect x="58" y="242" width="256" height="35" rx="8" fill="#fff" stroke="#dfe7e2"/><text x="70" y="264" fill="#33443a" font-family="Segoe UI,Arial,sans-serif" font-size="10">Sprint planning</text>
  <rect x="58" y="296" width="256" height="36" rx="8" fill="#fff" stroke="#dfe7e2"/><text x="186" y="319" text-anchor="middle" fill="#607064" font-family="Segoe UI,Arial,sans-serif" font-size="10">Convert to plain text</text>
  <rect x="58" y="350" width="256" height="81" rx="10" fill="#f6f8f6"/><text x="72" y="375" fill="#606e63" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700">CARD EDITING</text><text x="72" y="396" fill="#838e85" font-family="Segoe UI,Arial,sans-serif" font-size="9">Double-click to edit Markdown.</text><text x="72" y="413" fill="#838e85" font-family="Segoe UI,Arial,sans-serif" font-size="9">Resize freely; text size stays fixed.</text>
  <rect x="351" y="116" width="729" height="400" rx="13" fill="#fff" stroke="#e0e6e1"/><rect x="352" y="117" width="727" height="398" rx="12" fill="url(#property-grid)"/>
  <rect x="371" y="133" width="234" height="30" rx="8" fill="#fbfcfb" stroke="#e4e9e5"/><text x="385" y="153" fill="#3d493f" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="600">Planning.sketch · Page 1</text><circle cx="589" cy="148" r="3.5" fill="#78a37d"/>
  <rect x="537" y="229" width="380" height="176" rx="14" fill="#fff" stroke="#d9e2da" stroke-width="2" filter="url(#property-shadow)"/><rect x="539" y="231" width="376" height="42" rx="12" fill="#f5f8f4"/><rect x="539" y="257" width="376" height="16" fill="#f5f8f4"/><text x="559" y="258" fill="#344036" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Sprint planning</text><path d="m889 248 7 7 7-7" fill="none" stroke="#7d8c7d" stroke-width="1.5"/><path d="M559 289h336" stroke="#e8ede8"/>
  <text x="559" y="317" fill="#56635a" font-family="Segoe UI,Arial,sans-serif" font-size="10"># Sprint planning</text><text x="559" y="340" fill="#56635a" font-family="Segoe UI,Arial,sans-serif" font-size="10">- [ ] Gather the key ideas</text><text x="559" y="363" fill="#56635a" font-family="Segoe UI,Arial,sans-serif" font-size="10">- [ ] Choose the next step</text><text x="559" y="386" fill="#56635a" font-family="Segoe UI,Arial,sans-serif" font-size="10">The card stays editable on the canvas.</text>
  <rect x="498" y="214" width="458" height="206" rx="18" fill="none" stroke="#587ea9" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="537" cy="229" r="5" fill="#fff" stroke="#587ea9" stroke-width="1.5"/><circle cx="917" cy="405" r="5" fill="#fff" stroke="#587ea9" stroke-width="1.5"/>
  <rect x="371" y="464" width="299" height="31" rx="9" fill="#fbfcfb" stroke="#e4e9e5"/><text x="386" y="484" fill="#66736a" font-family="Segoe UI,Arial,sans-serif" font-size="9">A separate Layers panel opens from the toolbar.</text>
  <rect x="971" y="464" width="84" height="31" rx="9" fill="#fbfcfb" stroke="#e4e9e5"/><g transform="translate(997 470)" fill="none" stroke="#65776a" stroke-width="1.5" stroke-linejoin="round"><path d="m1 5 9-4 9 4-9 4zM1 9l9 4 9-4m-18 4 9 4 9-4"/></g>
</svg>