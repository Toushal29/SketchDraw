<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
  <title id="title">Markdown text and editable table preview</title>
  <desc id="desc">Illustrative SketchDraw text tool menu, Markdown source editor with insert table action, and a rendered editable table card on the canvas.</desc>
  <defs><pattern id="md-grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0v22" fill="none" stroke="#e9eeea"/></pattern><filter id="md-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#25352b" flood-opacity=".1"/></filter></defs>
  <rect width="1120" height="690" rx="20" fill="#f4f6f4"/><rect x="16" y="16" width="1088" height="658" rx="16" fill="#fff" stroke="#e0e6e1"/>
  <rect x="17" y="17" width="1086" height="43" rx="15" fill="#fbfcfb"/><path d="M17 60h1086" stroke="#e2e8e3"/><rect x="33" y="25" width="24" height="24" rx="7" fill="#252822"/><path d="M39 31c3-3 9-3 11-1s0 4-4 5-6 3-4 5 7 2 10 0" fill="none" stroke="#f7f4ec" stroke-width="1.5" stroke-linecap="round"/><circle cx="50" cy="31" r="1.7" fill="#f29a83"/><text x="67" y="42" fill="#3c463f" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="650">SketchDraw</text><text x="1021" y="42" fill="#829087" font-family="Segoe UI,Arial,sans-serif" font-size="10">Text and tables</text>
  <rect x="30" y="75" width="1060" height="48" rx="12" fill="#fbfcfb" stroke="#e3e9e4"/><g font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#58655a"><rect x="42" y="83" width="46" height="31" rx="8" fill="#eef3ef"/><text x="65" y="103" text-anchor="middle">Select</text><rect x="94" y="83" width="50" height="31" rx="8" fill="#e6f0e7" stroke="#cbddcc"/><text x="119" y="103" text-anchor="middle" fill="#507858">Text⌄</text><rect x="150" y="83" width="56" height="31" rx="8" fill="#eef3ef"/><text x="178" y="103" text-anchor="middle">Shapes</text><rect x="212" y="83" width="55" height="31" rx="8" fill="#eef3ef"/><text x="239" y="103" text-anchor="middle">Notes</text><path d="M280 89v20" stroke="#e2e8e3"/><rect x="297" y="83" width="61" height="31" rx="8" fill="#eef3ef"/><text x="327" y="103" text-anchor="middle">Undo</text><rect x="364" y="83" width="61" height="31" rx="8" fill="#eef3ef"/><text x="394" y="103" text-anchor="middle">Redo</text></g>
  <rect x="96" y="118" width="170" height="171" rx="13" fill="#fff" stroke="#dce5dd" filter="url(#md-shadow)"/><g font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#4b574d"><text x="114" y="145" font-weight="700" fill="#818d83" font-size="9" letter-spacing=".7">ADD TEXT</text><path d="M110 158h142" stroke="#edf0ed"/><rect x="107" y="168" width="148" height="30" rx="7" fill="#f1f6f1"/><text x="121" y="188" font-weight="650" fill="#4f7657">Markdown text</text><text x="121" y="219">Plain text</text><text x="121" y="249">Table</text><text x="121" y="279">Note + code</text></g>
  <rect x="29" y="138" width="1062" height="510" rx="12" fill="url(#md-grid)"/>
  <rect x="300" y="153" width="364" height="440" rx="16" fill="#fff" stroke="#d9e2da" filter="url(#md-shadow)"/><rect x="300" y="153" width="364" height="41" rx="15" fill="#fbfcfb"/><rect x="300" y="181" width="364" height="13" fill="#fbfcfb"/><path d="M300 194h364" stroke="#e5eae5"/><text x="320" y="179" fill="#556258" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing=".7">EDIT MARKDOWN</text><rect x="532" y="161" width="77" height="25" rx="7" fill="#f0f4f0" stroke="#e0e7e1"/><text x="570" y="178" text-anchor="middle" fill="#556358" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="600">Insert table</text><rect x="616" y="161" width="37" height="25" rx="7" fill="#e6f0e7"/><text x="634" y="178" text-anchor="middle" fill="#52765a" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700">Done</text>
  <g font-family="Consolas,monospace" font-size="11" fill="#435247"><text x="320" y="226" fill="#748575"># Sprint tasks</text><text x="320" y="254">Track work in a table:</text><text x="320" y="293" fill="#66876a">| Task | Owner | Status |</text><text x="320" y="316" fill="#66876a">| --- | --- | --- |</text><text x="320" y="339">| Define goals | Maya | Done |</text><text x="320" y="362">| Build draft | Leon | In progress |</text><text x="320" y="385">| Review | Alex | Next |</text><path d="M320 408h318" stroke="#eff2ef"/><text x="320" y="438" fill="#8b968d">Use Markdown headings, lists,</text><text x="320" y="459" fill="#8b968d">tables, and fenced code blocks.</text><rect x="319" y="485" width="318" height="83" rx="10" fill="#f7f9f7" stroke="#e7ece7"/><text x="334" y="509" fill="#708072">```ts</text><text x="334" y="532" fill="#435f8b">const next = "review";</text><text x="334" y="553" fill="#708072">```</text></g>
  <path d="M665 373h48" fill="none" stroke="#738776" stroke-width="2"/><path d="m706 366 8 7-8 7" fill="none" stroke="#738776" stroke-width="2"/>
  <rect x="718" y="226" width="341" height="265" rx="17" fill="#fff" stroke="#d9e2da" filter="url(#md-shadow)"/><rect x="718" y="226" width="341" height="48" rx="16" fill="#fbfcfb"/><rect x="718" y="260" width="341" height="14" fill="#fbfcfb"/><text x="741" y="256" fill="#334036" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Sprint tasks</text><text x="1037" y="255" text-anchor="end" fill="#96a096" font-family="Segoe UI,Arial,sans-serif" font-size="9">MARKDOWN</text><text x="741" y="299" fill="#748176" font-family="Segoe UI,Arial,sans-serif" font-size="10">Track work in a table:</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="10"><rect x="739" y="316" width="299" height="143" rx="9" fill="#fff" stroke="#dce5dd"/><path d="M739 353h299M739 389h299M739 425h299M854 316v143M941 316v143" stroke="#e5ebe6"/><rect x="740" y="317" width="297" height="35" rx="8" fill="#f1f6f1"/><text x="752" y="339" fill="#4e5d51" font-weight="700">Task</text><text x="867" y="339" fill="#4e5d51" font-weight="700">Owner</text><text x="954" y="339" fill="#4e5d51" font-weight="700">Status</text><text x="752" y="376" fill="#465249">Define goals</text><text x="867" y="376" fill="#465249">Maya</text><rect x="951" y="362" width="66" height="19" rx="9" fill="#e6f2e6"/><text x="984" y="375" text-anchor="middle" fill="#55765a" font-size="9">Done</text><text x="752" y="412" fill="#465249">Build draft</text><text x="867" y="412" fill="#465249">Leon</text><rect x="951" y="398" width="75" height="19" rx="9" fill="#fff3dd"/><text x="988" y="411" text-anchor="middle" fill="#90723e" font-size="9">In progress</text><text x="752" y="448" fill="#465249">Review</text><text x="867" y="448" fill="#465249">Alex</text><text x="954" y="448" fill="#859087">Next</text></g>
  <rect x="741" y="468" width="125" height="22" rx="7" fill="#f2f6f2"/><text x="804" y="483" text-anchor="middle" fill="#5a765e" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="600">Double-click to edit</text>
  <rect x="749" y="522" width="278" height="73" rx="13" fill="#fff7dc" stroke="#ead99d"/><text x="770" y="550" fill="#394136" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Also supported</text><text x="770" y="572" fill="#6e7567" font-family="Segoe UI,Arial,sans-serif" font-size="10">Convert plain text ↔ Markdown · legacy cards stay editable</text>
  <rect x="44" y="612" width="167" height="25" rx="8" fill="#fbfcfb" stroke="#e3e9e4"/><text x="57" y="629" fill="#78847a" font-family="Segoe UI,Arial,sans-serif" font-size="9">Canvas card stays editable</text>
</svg>
