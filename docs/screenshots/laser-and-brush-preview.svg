<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
  <title id="title">Laser pointer, standalone fine pen, and paint brush presets</title>
  <desc id="desc">Fine pen is its own toolbar tool. The Paint brushes menu contains pencil, soft brush, marker, highlighter, and chalk; laser controls include color, thickness, fade, and rainbow.</desc>
  <rect width="1080" height="620" rx="28" fill="#eef2f3"/><rect x="34" y="34" width="1012" height="552" rx="22" fill="#fbfcfc" stroke="#d5dedc"/>
  <text x="72" y="88" fill="#263632" font-family="Segoe UI, sans-serif" font-size="27" font-weight="700">Laser and drawing tools</text>
  <text x="72" y="120" fill="#72817c" font-family="Segoe UI, sans-serif" font-size="15">Keep the precise pen separate, then choose the brush texture you need.</text>
  <rect x="66" y="155" width="948" height="384" rx="18" fill="#f7faf9" stroke="#e1e8e5"/>
  <path d="M106 376 C173 292 227 438 300 355" fill="none" stroke="#303b47" stroke-width="3" stroke-linecap="round"/>
  <path d="M321 377 C388 285 444 441 514 347" fill="none" stroke="#8b5a44" stroke-width="10" stroke-linecap="round" opacity=".78"/>
  <path d="M535 377 C602 285 658 441 728 347" fill="none" stroke="#e1bb53" stroke-width="14" stroke-linecap="round" opacity=".45"/>
  <defs><linearGradient id="rainbow"><stop stop-color="#ff415d"/><stop offset=".2" stop-color="#ffb629"/><stop offset=".4" stop-color="#56cf5d"/><stop offset=".62" stop-color="#2ebdd5"/><stop offset=".82" stop-color="#7469ef"/><stop offset="1" stop-color="#f04ba3"/></linearGradient></defs>
  <path d="M112 244 C198 172 258 307 355 229" fill="none" stroke="url(#rainbow)" stroke-width="8" stroke-linecap="round"/>
  <rect x="750" y="170" width="225" height="205" rx="14" fill="#fff" stroke="#d8e1de"/>
  <text x="774" y="201" fill="#33433d" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Laser pointer</text>
  <text x="774" y="232" fill="#687770" font-family="Segoe UI, sans-serif" font-size="12">Thickness</text><text x="949" y="232" text-anchor="end" fill="#687770" font-family="Segoe UI, sans-serif" font-size="12">8 px</text>
  <rect x="774" y="244" width="175" height="5" rx="3" fill="#dfe6e3"/><rect x="774" y="244" width="68" height="5" rx="3" fill="#7c9d87"/>
  <text x="774" y="279" fill="#687770" font-family="Segoe UI, sans-serif" font-size="12">Fade duration</text><text x="949" y="279" text-anchor="end" fill="#687770" font-family="Segoe UI, sans-serif" font-size="12">1.5 s</text>
  <rect x="774" y="291" width="175" height="5" rx="3" fill="#dfe6e3"/><rect x="774" y="291" width="55" height="5" rx="3" fill="#7c9d87"/>
  <circle cx="784" cy="326" r="7" fill="#ff3265"/><circle cx="807" cy="326" r="7" fill="#ff9b35"/><circle cx="830" cy="326" r="7" fill="#44bf71"/><circle cx="853" cy="326" r="7" fill="#34b8de"/><circle cx="876" cy="326" r="7" fill="#7967e8"/><text x="896" y="330" fill="#687770" font-family="Segoe UI, sans-serif" font-size="11">Rainbow</text>
  <text x="94" y="435" fill="#65756c" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" letter-spacing="1">TOOLBAR</text>
  <rect x="94" y="451" width="180" height="54" rx="12" fill="#fff" stroke="#cdd9d2"/><rect x="106" y="462" width="32" height="32" rx="8" fill="#edf4ee" stroke="#d7e3d8"/><path d="m114 486 10-16 8 7-10 13h-8z" fill="none" stroke="#48645a" stroke-width="1.8"/><text x="151" y="482" fill="#34423d" font-family="Segoe UI, sans-serif" font-size="13" font-weight="650">Fine pen</text><text x="151" y="496" fill="#87938b" font-family="Segoe UI, sans-serif" font-size="9">Standalone tool</text>
  <rect x="294" y="451" width="200" height="54" rx="12" fill="#fff" stroke="#cdd9d2"/><rect x="306" y="462" width="32" height="32" rx="8" fill="#edf4ee" stroke="#d7e3d8"/><path d="m313 486 13-16 7 8-13 13h-7z" fill="#d7ab68" stroke="#806a4f" stroke-width="1.5"/><text x="349" y="482" fill="#34423d" font-family="Segoe UI, sans-serif" font-size="13" font-weight="650">Paint brushes</text><text x="349" y="496" fill="#87938b" font-family="Segoe UI, sans-serif" font-size="9">Choose a texture</text>
  <rect x="514" y="414" width="210" height="107" rx="13" fill="#fff" stroke="#d8e1de"/><text x="532" y="440" fill="#34423d" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Paint brushes</text>
