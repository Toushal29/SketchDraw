  <title id="title">SketchDraw landscape touch workspace preview</title>
  <desc id="desc">Illustrative landscape tablet workspace with a vertical compact touch tool dock and a horizontal quick-style strip immediately to the left of the zoom reset button. The strip opens a horizontal color preset list and keeps stroke width visible.</desc>
