<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Complex SketchDraw workflow diagram preview</title>
  <desc id="desc">A multi-stage offline-first document workflow with decisions, retries, attached connectors, database storage, and notifications.</desc>
  <defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d9d9d3"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 9 5 0 9" fill="none" stroke="#66736b" stroke-width="1.5"/></marker><marker id="solid" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="m0 0 10 5-10 5z" fill="#66736b"/></marker></defs>
  <rect width="1440" height="920" rx="24" fill="#f8f8f5"/><rect x="1" y="1" width="1438" height="918" rx="23" fill="none" stroke="#dddcd5"/><rect x="2" y="2" width="1436" height="916" rx="22" fill="url(#dots)" opacity=".55"/>
  <g font-family="Arial,sans-serif"><rect x="42" y="32" width="1356" height="68" rx="15" fill="#fff" stroke="#e2e1da"/><text x="72" y="61" font-size="10" letter-spacing="2" fill="#7d8478">SYSTEM DESIGN · EXAMPLE SKETCH</text><text x="72" y="84" font-size="18" font-weight="700" fill="#30332e">Local-first document workflow</text><rect x="1228" y="49" width="134" height="34" rx="9" fill="#edf1e9"/><circle cx="1246" cy="66" r="4" fill="#65916c"/><text x="1258" y="70" font-size="11" fill="#536c55">All changes saved</text>
  <rect x="76" y="148" width="1288" height="128" rx="16" fill="#eef2ea" stroke="#d8dfd1"/><text x="98" y="174" font-size="10" letter-spacing="1.8" fill="#75806e">1 · CAPTURE AND VALIDATE</text><rect x="112" y="199" width="150" height="52" rx="25" fill="#fff" stroke="#708572" stroke-width="2"/><text x="149" y="231" font-size="13" fill="#343a34">New idea</text><path d="M262 225h80" fill="none" stroke="#66736b" stroke-width="2" marker-end="url(#arrow)"/><path d="m398 194 70 31-70 31-70-31z" fill="#fff4cf" stroke="#bd9a46" stroke-width="2"/><text x="370" y="230" font-size="12" fill="#5e512d">Has details?</text><path d="M468 225h86" fill="none" stroke="#66736b" stroke-width="2" marker-end="url(#arrow)"/><rect x="566" y="199" width="166" height="52" rx="8" fill="#fff" stroke="#6f879b" stroke-width="2"/><text x="589" y="231" font-size="13" fill="#343a34">Add description</text><path d="M732 225h83" fill="none" stroke="#66736b" stroke-width="2" marker-end="url(#arrow)"/><path d="m880 194 70 31-70 31-70-31z" fill="#fff4cf" stroke="#bd9a46" stroke-width="2"/><text x="852" y="230" font-size="12" fill="#5e512d">Valid?</text><path d="M950 225h94" fill="none" stroke="#66736b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1056" y="199" width="186" height="52" rx="8" fill="#e6eff6" stroke="#748da2" stroke-width="2"/><text x="1084" y="231" font-size="13" fill="#343a34">Queue for save</text><text x="484" y="213" font-size="10" fill="#77806d">yes</text><path d="M398 256v58h146" fill="none" stroke="#aa6e68" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="407" y="277" font-size="10" fill="#a15f59">no · request details</text><path d="M880 256v57h164" fill="none" stroke="#aa6e68" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="892" y="277" font-size="10" fill="#a15f59">no · return for correction</text>
  <rect x="76" y="338" width="1288" height="174" rx="16" fill="#f1eef7" stroke="#e0d9ed"/><text x="98" y="364" font-size="10" letter-spacing="1.8" fill="#817393">2 · SAVE, SYNC, AND RECOVER</text><rect x="136" y="396" width="182" height="68" rx="9" fill="#fff" stroke="#806da2" stroke-width="2"/><text x="173" y="425" font-size="13" fill="#37313e">Write temp file</text><text x="161" y="446" font-size="10" fill="#787183">atomic replacement</text><path d="M318 430h104" fill="none" stroke="#66736b" stroke-width="2" marker-end="url(#arrow)"/><path d="m493 393 73 37-73 37-73-37z" fill="#fff4cf" stroke="#bd9a46" stroke-width="2"/><text x="458" y="434" font-size="12" fill="#5e512d">Write okay?</text><path d="M566 430h96" fill="none" stroke="#66736b" stroke-width="2" marker-end="url(#arrow)"/><path d="M710 393c-22 0-39 13-39 37s17 37 39 37h112c22 0 39-13 39-37s-17-37-39-37z" fill="#e6f0e6" stroke="#6e9273" stroke-width="2"/><text x="709" y="426" font-size="13" fill="#344638">Update local file</text><text x="735" y="447" font-size="10" fill="#647a68">saved state</text><path d="M861 430h96" fill="none" stroke="#66736b" stroke-width="2" marker-end="url(#arrow)"/><path d="M1000 401c0-8 43-15 80-15s80 7 80 15v60c0 8-43 15-80 15s-80-7-80-15z" fill="#e8f0f6" stroke="#718b9e" stroke-width="2"/><ellipse cx="1080" cy="401" rx="80" ry="15" fill="#f4f8fa" stroke="#718b9e" stroke-width="2"/><path d="M1000 401c0 8 43 15 80 15s80-7 80-15" fill="none" stroke="#718b9e" stroke-width="1.5"/><text x="1045" y="438" font-size="13" fill="#34404b">Cloud folder</text><path d="M1080 477v45H800v-10" fill="none" stroke="#66736b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="899" y="510" font-size="10" fill="#68796b">external edits checked before autosave</text><path d="M493 467v35H320" fill="none" stroke="#aa6e68" stroke-width="1.8" marker-end="url(#arrow)"/><text x="377" y="493" font-size="10" fill="#a15f59">no · keep recovery, show conflict</text>
  <rect x="76" y="574" width="1288" height="260" rx="16" fill="#eaf1f3" stroke="#d3e0e3"/><text x="98" y="600" font-size="10" letter-spacing="1.8" fill="#6e8790">3 · COLLABORATE THROUGH PORTABLE FILES</text><rect x="127" y="642" width="185" height="73" rx="9" fill="#fff" stroke="#6f879b" stroke-width="2"/><text x="161" y="673" font-size="13" fill="#34404b">Choose sync folder</text><text x="162" y="695" font-size="10" fill="#737e82">user-controlled location</text><path d="M312 678h116" fill="none" stroke="#66736b" stroke-width="2" marker-end="url(#arrow)"/><rect x="435" y="642" width="189" height="73" rx="9" fill="#fff" stroke="#6f879b" stroke-width="2"/><text x="474" y="673" font-size="13" fill="#34404b">Sync provider</text><text x="470" y="695" font-size="10" fill="#737e82">OneDrive · iCloud · Drive</text><path d="M624 678h116" fill="none" stroke="#66736b" stroke-width="2" marker-end="url(#arrow)"/><rect x="747" y="642" width="180" height="73" rx="9" fill="#fff" stroke="#6f879b" stroke-width="2"/><text x="782" y="673" font-size="13" fill="#34404b">Another device</text><text x="778" y="695" font-size="10" fill="#737e82">open the same .sketch file</text><path d="M927 678h110" fill="none" stroke="#66736b" stroke-width="2" marker-end="url(#arrow)"/><path d="m1122 637 82 41-82 41-82-41z" fill="#fff4cf" stroke="#bd9a46" stroke-width="2"/><text x="1085" y="682" font-size="12" fill="#5e512d">Conflict?</text><path d="M1204 678h75" fill="none" stroke="#66736b" stroke-width="2" marker-end="url(#solid)"/><rect x="1286" y="649" width="58" height="58" rx="29" fill="#edf3e9" stroke="#7a936c" stroke-width="2"/><path d="m1305 678 9 9 15-19" fill="none" stroke="#66805d" stroke-width="2.5"/><path d="M1122 719v42H922" fill="none" stroke="#748591" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="969" y="752" font-size="10" fill="#667984">compare and choose which copy to keep</text><text x="99" y="799" font-size="11" fill="#737b77">Connectors stay attached to their shapes · each project can contain multiple pages · PDF export supports print page setup</text></g>
</svg>
