name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Check canvas input, diagram imports, and control accessibility
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch' && !contains(github.event.head_commit.message, '[skip browser audit]')) }}
        run: npm run test:canvas

  windows-release:
    if: >-
      (github.event_name == 'release' && !contains(github.event.release.body, 'Created automatically by the release tag workflow.')) ||
      (github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check updater signing key
        id: signing
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required to publish a Windows release with verified in-app updates."
          }
          "configured=true" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.signing.outputs.configured == 'true'
      - name: Build signed Windows release and updater manifest
        if: steps.signing.outputs.configured == 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          tagName: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
          releaseId: ${{ github.event_name == 'release' && github.event.release.id || '' }}
          releaseName: ${{ github.event_name == 'push' && format('SketchDraw {0}', github.ref_name) || github.event.release.name || '' }}
          releaseBody: ${{ github.event_name == 'push' && format('Created automatically by the release tag workflow. See [release notes]({0}/{1}/blob/{2}/docs/release-notes-{2}.md).', github.server_url, github.repository, github.ref_name) || github.event.release.body || '' }}
          releaseCommitish: ${{ github.sha }}
          args: --target x86_64-pc-windows-msvc
          uploadUpdaterJson: true
